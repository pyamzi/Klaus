<!-- Klaus pdf.js viewer (K-096 foundation; K-097..K-099 parity).

Loaded by pdfjs_viewer.PdfJsViewer via AnkiWebView.stdHtml after two
placeholder substitutions — the addon web-export name (the pdf.js
script/worker URLs near the bottom) and the CSS custom properties
generated from theme.py tokens (the second :root rule below; single
source of truth for colours — do not hardcode hex here). Both are
plain global str.replace, so no comment in this file spells either
placeholder: a mention gets the replacement spliced into it. They are
named, safely, in pdfjs_viewer.build_page_html.

Division of labour: this page owns rendering and gestures; PYTHON OWNS
THE ANNOTATIONS JSON. Every mutation (add/remove highlight, note edit,
text placement) goes over the bridge as klausmate_pdfjs:* and Python
persists via
pdf_handler.save_annotations + the debounced bake, then pushes the
canonical records back through window.klausSetAnnotations. The page
never invents record fields — coordinates are page points, top-left
origin, matching the native viewer and the bake pipeline exactly
(CSS px = points x state.scale).
-->
<style>
  /* --hover-subtle is the findbar/annobar/menu/thumb family's hover
     fill, and theme.css_vars now emits it from the palette token the
     Qt-side builders hover with, so both halves match. This neutral
     midtone stays as a SAFETY NET only — ordered FIRST so the theme
     substitution below always wins — because an undefined var() would
     compute those backgrounds to nothing, killing every hover in the

  :root { --hover-subtle: rgba(127, 127, 127, 0.16); }
  :root { __THEME_VARS__ }
  html, body {

  /* ---- thumbnail strip ---- */

  #scroll { flex: 1 1 auto; overflow: auto; position: relative; }
  /* width: max-content (min 100%) — a page zoomed WIDER than the

  .page {
    position: relative; background: white;
    border: 1px solid var(--grey-light); border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  }
  .page canvas.pg { display: block; border-radius: 4px; }
  /* pdf.js text layer: invisible glyph spans over the canvas so native

  .textLayer {
    position: absolute; left: 0; top: 0; overflow: hidden;
    line-height: 1; opacity: 1; pointer-events: auto; z-index: 3;
    text-align: initial;
    -webkit-text-size-adjust: none; text-size-adjust: none;

  /* highlights render UNDER the text layer, above the canvas */
  .hlLayer { position: absolute; inset: 0; pointer-events: none; z-index: 1; }

  .hlLayer .hltext { position: absolute; white-space: pre-wrap;

  .noteLayer { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
  .noteLayer .noteAnchor {

<script src="/_addons/__ADDON__/web/pdfjs/pdf.min.js"></script>
<script>
"use strict";
/* global pdfjsLib */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "/_addons/__ADDON__/web/pdfjs/pdf.worker.min.js";

/* One clamp for every zoom writer (fit, ⌘ keys, menu, toolbar, pinch)
   — a preview that promises a scale the settle refuses would jump. */
const MIN_SCALE = 0.25, MAX_SCALE = 4.0;
function clampScale(s) { return Math.max(MIN_SCALE, Math.min(MAX_SCALE, s)); }

const state = {
  doc: null,
  scale: 1.0,
  userZoomed: false,
  pageDivs: [],
  rendered: new Map(),   // pageNum -> {canvas, textLayer, spans[]}
  observer: null,
  thumbObserver: null,
  currentPage: 0,
  b64parts: [],
  annots: [],            // canonical records, pushed from Python
  pageTexts: null,       // [{str, items:[{start,len}]}] lazily built for find
  find: { query: "", matches: [], index: -1 },
  marquee: null,         // {page, x0, y0} while alt-dragging
  zoom: null,            // live zoom session — pinch or stepped (zoomTo)
  tool: null,            // "hl" | "text" | null — annobar mode
};

function post(msg) {
  try { pycmd("klausmate_pdfjs:" + msg); } catch (e) { /* headless */ }
}

/* pdf.js 3.x CONTRACT: the text layer sizes its glyph spans with
   calc(var(--scale-factor) * ...). Without this property the calc() is
   invalid, every span falls back to the default font size, and the
   selection layer no longer matches the painted page (the exact
   misalignment + broken-highlight bug found live). Must track
   state.scale everywhere it changes. */
function applyScaleFactor() {
  document.getElementById("pages").style.setProperty(
    "--scale-factor", String(state.scale));
  updateZoomReadout(state.scale);
}

/* The annobar's live % — fed from applyScaleFactor (every committed
   scale change funnels through it) and directly during a pinch, whose
   interim scale exists only as a CSS transform. */
function updateZoomReadout(scale) {
  const el = document.getElementById("abZoomPct");
  if (el) el.textContent = Math.round(scale * 100) + "%";
}
function postB64(action, obj) {
  const json = JSON.stringify(obj);
  post(action + ":" + btoa(unescape(encodeURIComponent(json))));
}

/* ==== feed ========================================================= */
window.klausPdfChunk = function (part) { state.b64parts.push(part); };
window.klausPdfLoad = function () {
  const b64 = state.b64parts.join("");
  state.b64parts = [];
  const raw = atob(b64);
  const bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  openDocument(bytes);
};
window.klausPdfError = function (text) {
  const el = document.getElementById("error");
  el.textContent = text;
  el.style.display = "block";
};

async function openDocument(bytes) {
  teardown();
  try {
    state.doc = await pdfjsLib.getDocument({ data: bytes }).promise;
  } catch (e) {
    window.klausPdfError("Could not open this PDF: " + e.message);
    post("log:open failed: " + e.message);
    return;
  }
  post("count:" + state.doc.numPages);
  await buildPlaceholders();
  buildThumbs();
  observePages();
  post("ready");
}

async function availWidth() {
  // Host panel may not be laid out yet (caught live: zero width at load
  // rendered everything at the 0.25 floor). Wait up to ~1s.
  const el = document.getElementById("scroll");
  for (let i = 0; i < 60 && el.clientWidth < 60; i++) {
    await new Promise((r) => requestAnimationFrame(r));
  }
  return Math.max(60, el.clientWidth) - 24;
}

async function buildPlaceholders() {
  const pagesEl = document.getElementById("pages");
  pagesEl.textContent = "";
  state.pageDivs = [];
  const first = await state.doc.getPage(1);
  const base = first.getViewport({ scale: 1.0 });
  const avail = await availWidth();
  state.scale = clampScale(avail / base.width);
  applyScaleFactor();
  for (let i = 1; i <= state.doc.numPages; i++) {
    const div = document.createElement("div");
    div.className = "page";
    div.dataset.page = String(i);
    div.style.width = Math.floor(base.width * state.scale) + "px";
    div.style.height = Math.floor(base.height * state.scale) + "px";
    pagesEl.appendChild(div);
    state.pageDivs.push(div);
  }
}

new ResizeObserver(async () => {
  if (!state.doc || state.userZoomed) return;
  const first = await state.doc.getPage(1);
  const base = first.getViewport({ scale: 1.0 });
  const target = clampScale(
    (document.getElementById("scroll").clientWidth - 24) / base.width
  );
  if (Math.abs(target - state.scale) / state.scale > 0.02) {
    state.scale = target;
    rezoom(state.currentPage || 1);
  }
}).observe(document.getElementById("scroll"));

function observePages() {
  if (state.observer) state.observer.disconnect();
  state.observer = new IntersectionObserver(onIntersect, {
    root: document.getElementById("scroll"),
    rootMargin: "150% 0px",
  });
  for (const d of state.pageDivs) state.observer.observe(d);
  const scroll = document.getElementById("scroll");
  scroll.addEventListener("scroll", trackCurrentPage, { passive: true });
  scroll.addEventListener("scroll", scheduleScrollReport, { passive: true });
}

function onIntersect(entries) {
  for (const en of entries) {
    const idx = parseInt(en.target.dataset.page, 10);
    if (en.isIntersecting) renderPage(idx, en.target);
    else teardownPage(idx, en.target);
  }
}

async function renderPage(num, div) {
  if (state.rendered.has(num) || !state.doc) return;
  state.rendered.set(num, {});   // claim before await (re-entrancy)
  try {
    const page = await state.doc.getPage(num);
    const viewport = page.getViewport({ scale: state.scale });
    div.style.width = Math.floor(viewport.width) + "px";
    div.style.height = Math.floor(viewport.height) + "px";
    const canvas = document.createElement("canvas");
    canvas.className = "pg";
    const ratio = window.devicePixelRatio || 1;
    canvas.width = Math.floor(viewport.width * ratio);
    canvas.height = Math.floor(viewport.height * ratio);
    canvas.style.width = Math.floor(viewport.width) + "px";
    canvas.style.height = Math.floor(viewport.height) + "px";
    const ctx = canvas.getContext("2d");
    await page.render({
      canvasContext: ctx, viewport: viewport,
      transform: ratio !== 1 ? [ratio, 0, 0, ratio, 0, 0] : null,
      annotationMode: pdfjsLib.AnnotationMode.DISABLE,
    }).promise;
    const textLayer = document.createElement("div");
    textLayer.className = "textLayer";
    textLayer.style.width = Math.floor(viewport.width) + "px";
    textLayer.style.height = Math.floor(viewport.height) + "px";
    // Attach BEFORE rendering the text layer: pdf.js measures each
    // span's real width against its computed style to derive the
    // per-span scaleX correction, and a detached node has no computed
    // style — glyphs drift horizontally without this.
    div.appendChild(canvas);
    div.appendChild(textLayer);
    const textContent = await page.getTextContent();
    const task = pdfjsLib.renderTextLayer({
      textContentSource: textContent,
      container: textLayer,
      viewport: viewport,
    });
    if (task && task.promise) { try { await task.promise; } catch (e) {} }
    const spans = Array.from(textLayer.querySelectorAll("span"));
    state.rendered.set(num, { canvas, textLayer, spans });
    renderAnnotLayers(num, div);
    if (state.find.matches.length) highlightCurrentMatchIfVisible();
    if (Math.abs(viewport.scale - state.scale) > 0.0005) {
      // A zoom settled while this render was in flight — its output
      // is stale-scale. refreshPage redraws crisp, fixes the div size.
      refreshPage(num, div);
    }
  } catch (e) {
    state.rendered.delete(num);
    post("log:render " + num + " failed: " + e.message);
  }
}

function teardownPage(num, div) {
  const r = state.rendered.get(num);
  if (!r || !r.canvas) return;   // never tear down a mid-render claim
  for (const cls of ["canvas.pg", ".textLayer", ".hlLayer", ".noteLayer"]) {
    const el = div.querySelector(cls);
    if (el) { try { div.removeChild(el); } catch (e) {} }
  }
  state.rendered.delete(num);
}

function teardown() {
  if (state.observer) state.observer.disconnect();
  state.rendered.clear();
  state.pageDivs = [];
  state.annots = [];
  state.pageTexts = null;
  state.find = { query: "", matches: [], index: -1 };
  document.getElementById("pages").textContent = "";
  document.getElementById("thumbs").textContent = "";
  document.getElementById("error").style.display = "none";
  state.doc = null;
  state.currentPage = 0;
}

function trackCurrentPage() {
  const scroll = document.getElementById("scroll");
  const mid = scroll.scrollTop + scroll.clientHeight / 3;
  let page = 1;
  for (const d of state.pageDivs) {
    if (d.offsetTop <= mid) page = parseInt(d.dataset.page, 10);
    else break;
  }
  if (page !== state.currentPage) {
    state.currentPage = page;
    post("page:" + page + ":" + (state.doc ? state.doc.numPages : 0));
    markCurrentThumb(page);
  }
}

let scrollReportTimer = null;
function scheduleScrollReport() {
  if (scrollReportTimer) clearTimeout(scrollReportTimer);
  scrollReportTimer = setTimeout(() => {
    post("scroll:" + Math.round(document.getElementById("scroll").scrollTop));
  }, 300);
}

/* ==== annotations (records owned by Python) ======================== */
window.klausSetAnnotations = function (records) {
  state.annots = Array.isArray(records) ? records : [];
  for (const [num, r] of state.rendered) {
    if (r && r.canvas) {
      renderAnnotLayers(num, state.pageDivs[num - 1]);
    }
  }
};

function hexToRgba(hex, alpha) {
  try {
    const h = String(hex || "#fadc50").replace("#", "");
    const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16),
          b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  } catch (e) { return "rgba(250, 220, 80, " + alpha + ")"; }
}

function renderAnnotLayers(num, div) {
  if (!div) return;
  for (const cls of [".hlLayer", ".noteLayer"]) {
    const old = div.querySelector(cls);
    if (old) div.removeChild(old);
  }
  const hlLayer = document.createElement("div");
  hlLayer.className = "hlLayer";
  const noteLayer = document.createElement("div");
  noteLayer.className = "noteLayer";
  const s = state.scale;
  for (const rec of state.annots) {
    if ((rec.page | 0) !== num - 1) continue;   // records are 0-based
    const rects = rec.rects || [];
    if (rec.kind === "text" && rects.length) {
      const [x, y, w, h] = rects[0];
      const t = document.createElement("div");
      t.className = "hltext";
      t.textContent = String(rec.text || "");
      t.style.left = x * s + "px";
      t.style.top = y * s + "px";
      t.style.width = w * s + "px";
      t.style.height = h * s + "px";
      t.style.color = String(rec.color || "#000000");
      t.style.fontSize = Math.max(6, (parseFloat(rec.size) || 12) * s) + "px";
      hlLayer.appendChild(t);
    } else {
      let first = null;
      for (const r of rects) {
        const [x, y, w, h] = r;
        const d = document.createElement("div");
        d.className = "hl";
        d.style.left = x * s + "px";
        d.style.top = y * s + "px";
        d.style.width = w * s + "px";
        d.style.height = h * s + "px";
        d.style.background = hexToRgba(rec.color, 0.43);
        hlLayer.appendChild(d);
        if (!first) first = r;
      }
      const note = String(rec.note || "").trim();
      if (note && first) {
        const a = document.createElement("div");
        a.className = "noteAnchor";
        a.textContent = "✎";
        a.title = note;
        a.style.left = (first[0] + first[2]) * s - 8 + "px";
        a.style.top = first[1] * s - 8 + "px";
        a.dataset.hlid = String(rec.id || "");
        a.addEventListener("click", (ev) => {
          ev.stopPropagation();
          postB64("note-edit", { id: a.dataset.hlid });
        });
        noteLayer.appendChild(a);
      }
    }
  }
  div.appendChild(hlLayer);
  div.appendChild(noteLayer);
}

/* Selection -> {pageIndex0: [[x,y,w,h] page pts]}. A rect belongs to
   the page containing its CENTER (full containment was too strict —
   sub-pixel span overhang silently dropped rects), then gets clamped
   into that page's box. */
function selectionRectMap() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const map = {};
  const s = state.scale;
  for (let i = 0; i < sel.rangeCount; i++) {
    for (const cr of sel.getRangeAt(i).getClientRects()) {
      if (cr.width < 1 || cr.height < 1) continue;
      const cx = cr.left + cr.width / 2, cy = cr.top + cr.height / 2;
      for (const div of state.pageDivs) {
        const pr = div.getBoundingClientRect();
        if (cx >= pr.left && cx <= pr.right && cy >= pr.top && cy <= pr.bottom) {
          const page = parseInt(div.dataset.page, 10) - 1;
          const x0 = Math.max(cr.left, pr.left), y0 = Math.max(cr.top, pr.top);
          const x1 = Math.min(cr.right, pr.right), y1 = Math.min(cr.bottom, pr.bottom);
          if (x1 - x0 >= 1 && y1 - y0 >= 1) {
            (map[page] = map[page] || []).push([
              (x0 - pr.left) / s, (y0 - pr.top) / s,
              (x1 - x0) / s, (y1 - y0) / s,
            ]);
          }
          break;
        }
      }
    }
  }
  return Object.keys(map).length ? map : null;
}

function addHighlightFromSelection() {
  const map = selectionRectMap();
  if (!map) { post("toast:" + btoa("Klaus: select text first, then highlight")); return; }
  postB64("hl-add", { pages: map });
  window.getSelection().removeAllRanges();
}

/* Topmost highlight record under (page0, xPt, yPt), like _highlight_at. */
function highlightAt(page0, xPt, yPt, tol) {
  tol = tol || 3;
  for (let i = state.annots.length - 1; i >= 0; i--) {
    const rec = state.annots[i];
    if ((rec.page | 0) !== page0) continue;
    for (const r of rec.rects || []) {
      const [x, y, w, h] = r;
      if (x - tol <= xPt && xPt <= x + w + tol &&
          y - tol <= yPt && yPt <= y + h + tol) return rec;
    }
  }
  return null;
}

/* ==== clipboard helpers ============================================ */
function pageAndPoint(clientX, clientY) {
  for (const div of state.pageDivs) {
    const pr = div.getBoundingClientRect();
    if (clientX >= pr.left && clientX <= pr.right &&
        clientY >= pr.top && clientY <= pr.bottom) {
      return {
        div, page0: parseInt(div.dataset.page, 10) - 1,
        xPt: (clientX - pr.left) / state.scale,
        yPt: (clientY - pr.top) / state.scale,
      };
    }
  }
  return null;
}

async function copyPageImage(page0) {
  // Render offscreen at a fixed quality scale so the copy doesn't
  // depend on the current zoom (matches the native slide copy).
  try {
    const page = await state.doc.getPage(page0 + 1);
    const viewport = page.getViewport({ scale: 2.0 });
    const canvas = document.createElement("canvas");
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport, annotationMode: pdfjsLib.AnnotationMode.DISABLE }).promise;
    post("copy-image:" + canvas.toDataURL("image/png").split(",", 2)[1]);
  } catch (e) { post("log:copy page image failed: " + e.message); }
}

async function copyRegionImage(page0, xPt, yPt, wPt, hPt) {
  try {
    const page = await state.doc.getPage(page0 + 1);
    const q = 2.0;
    const viewport = page.getViewport({ scale: q });
    const full = document.createElement("canvas");
    full.width = Math.floor(viewport.width);
    full.height = Math.floor(viewport.height);
    await page.render({ canvasContext: full.getContext("2d"), viewport, annotationMode: pdfjsLib.AnnotationMode.DISABLE }).promise;
    const out = document.createElement("canvas");
    out.width = Math.max(1, Math.floor(wPt * q));
    out.height = Math.max(1, Math.floor(hPt * q));
    out.getContext("2d").drawImage(
      full, xPt * q, yPt * q, wPt * q, hPt * q,
      0, 0, out.width, out.height);
    post("copy-image:" + out.toDataURL("image/png").split(",", 2)[1]);
  } catch (e) { post("log:copy region failed: " + e.message); }
}

async function copyPageText(page0) {
  const texts = await ensurePageTexts();
  const t = (texts[page0] && texts[page0].str) || "";
  /* toast: menu-driven page capture confirms like the native viewer;
     plain selection copy stays silent (Preview-style). */
  postB64("copy-text", { text: t, toast: true });
}

/* ==== context menu ================================================= */
const ctxmenu = document.getElementById("ctxmenu");
function hideMenu() { ctxmenu.style.display = "none"; }
/* Cancel mousedown anywhere in the menu so the text selection SURVIVES
   until the click handler runs. Blink collapses the selection on a
   trusted mousedown over a non-editable element, and it does so BEFORE
   click fires — so every selection-dependent item ("Highlight", "Copy",
   "Copy Selection as Image") saw an empty selection and behaved as
   though nothing had been selected. "Highlight" reported "select text
   first" on a selection the menu had just used to decide to offer the
   item at all, which is what made highlighting look completely broken.
   Verified in a real Blink engine with actual mouse input: click-only
   wiring reads the selection as collapsed, this listener keeps it alive.
   preventDefault on mousedown suppresses only the focus/collapse default
   — click still fires, and the items are plain divs with nothing to
   focus. */
ctxmenu.addEventListener("mousedown", (ev) => ev.preventDefault());
document.addEventListener("click", hideMenu);
document.addEventListener("scroll", hideMenu, true);

document.getElementById("scroll").addEventListener("contextmenu", (ev) => {
  const hit = pageAndPoint(ev.clientX, ev.clientY);
  if (!hit) return;
  ev.preventDefault();
  const sel = window.getSelection();
  const hasSel = sel && !sel.isCollapsed && String(sel).trim().length > 0;
  const rec = highlightAt(hit.page0, hit.xPt, hit.yPt);
  const items = [];
  if (hasSel) {
    items.push(["Copy", () => postB64("copy-text", { text: String(sel) })]);
    items.push(["Copy Selection as Image", () => {
      const map = selectionRectMap();
      if (!map) return;
      const page0 = parseInt(Object.keys(map)[0], 10);
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      for (const [x, y, w, h] of map[page0]) {
        x0 = Math.min(x0, x); y0 = Math.min(y0, y);
        x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h);
      }
      copyRegionImage(page0, x0, y0, x1 - x0, y1 - y0);
    }]);
    items.push(["Highlight", addHighlightFromSelection]);
    items.push(null);
  }
  if (rec) {
    if (rec.kind === "text") {
      items.push(["Remove Text", () => postB64("hl-remove", { id: rec.id })]);
    } else {
      const hasNote = String(rec.note || "").trim().length > 0;
      items.push([hasNote ? "Edit note…" : "Add note…",
                  () => postB64("note-edit", { id: rec.id })]);
      items.push(["Remove Highlight", () => postB64("hl-remove", { id: rec.id })]);
    }
    items.push(null);
  }
  items.push(["Copy Page Text", () => copyPageText(hit.page0)]);
  items.push(["Copy Slide as Image", () => copyPageImage(hit.page0)]);
  items.push(null);
  /* Zoom lived only on ⌘+/−/0 with no visible affordance anywhere
     (critique P3) — the menu is its discoverable twin. */
  items.push(["Zoom In\u2002\u2318+", () => window.klausSetZoom(1.1)]);
  items.push(["Zoom Out\u2002\u2318\u2212", () => window.klausSetZoom(1 / 1.1)]);
  items.push(["Actual Size\u2002\u23180", () => window.klausZoomReset()]);
  ctxmenu.textContent = "";
  for (const it of items) {
    if (it === null) {
      const s = document.createElement("div"); s.className = "sep";
      ctxmenu.appendChild(s); continue;
    }
    const mi = document.createElement("div");
    mi.className = "mi"; mi.textContent = it[0];
    mi.addEventListener("click", (e) => { e.stopPropagation(); hideMenu(); it[1](); });
    ctxmenu.appendChild(mi);
  }
  ctxmenu.style.display = "block";
  const mw = ctxmenu.offsetWidth, mh = ctxmenu.offsetHeight;
  ctxmenu.style.left = Math.min(ev.clientX, window.innerWidth - mw - 4) + "px";
  ctxmenu.style.top = Math.min(ev.clientY, window.innerHeight - mh - 4) + "px";
});

/* ==== marquee (Option/Alt+drag copy-as-image) ====================== */
const marqueeEl = document.getElementById("marquee");
document.getElementById("scroll").addEventListener("mousedown", (ev) => {
  if (!ev.altKey || ev.button !== 0) return;
  const hit = pageAndPoint(ev.clientX, ev.clientY);
  if (!hit) return;
  ev.preventDefault();
  state.marquee = { page0: hit.page0, x0: ev.clientX, y0: ev.clientY };
});
document.addEventListener("mousemove", (ev) => {
  if (!state.marquee) return;
  const m = state.marquee;
  marqueeEl.style.display = "block";
  marqueeEl.style.left = Math.min(m.x0, ev.clientX) + "px";
  marqueeEl.style.top = Math.min(m.y0, ev.clientY) + "px";
  marqueeEl.style.width = Math.abs(ev.clientX - m.x0) + "px";
  marqueeEl.style.height = Math.abs(ev.clientY - m.y0) + "px";
});
document.addEventListener("mouseup", (ev) => {
  if (!state.marquee) return;
  const m = state.marquee;
  state.marquee = null;
  marqueeEl.style.display = "none";
  const div = state.pageDivs[m.page0];
  if (!div) return;
  const pr = div.getBoundingClientRect();
  const s = state.scale;
  const x0 = (Math.min(m.x0, ev.clientX) - pr.left) / s;
  const y0 = (Math.min(m.y0, ev.clientY) - pr.top) / s;
  const w = Math.abs(ev.clientX - m.x0) / s;
  const h = Math.abs(ev.clientY - m.y0) / s;
  if (w > 4 && h > 4) copyRegionImage(m.page0, x0, y0, w, h);
});

/* ==== zoom engine (K-116) ========================================== */
/* EVERY zoom path — trackpad pinch, \u2318+/\u2212/0, the context menu, the
   annobar buttons — funnels through one session (zoomTo), because the
   old direct path (a synchronous full rezoom per step) tore every
   canvas down and re-rendered from blank: the "zoom renders slowly"
   complaint, live.

   A session gives instant feedback for ~free: the first call captures
   an anchor (the document point to hold still — the cursor for a
   pinch, the viewport centre for stepped zoom) and every call after
   only updates a compositor transform on #pages, origined at that
   anchor. ZOOM_SETTLE_MS after the last input the session settles:
   the transform comes off, softRelayout() resizes the layout and
   CSS-stretches the ALREADY-RENDERED canvases into the new geometry
   (soft, never blank), scroll is corrected so the anchored point
   stays under the pointer exactly, and refreshVisibleFirst()
   re-renders crisp bitmaps — viewport pages first — each swapped in
   only once fully drawn.

   Chromium delivers macOS trackpad pinch to the page as wheel events
   with ctrlKey:true (Ctrl+scroll on a mouse arrives identically).
   Un-handled, QtWebEngine pinch-zooms the whole FRAME — page, sidebar
   and all — fighting the Python-side setZoomFactor(1.0) pin, so every
   ctrl-wheel is preventDefault()ed document-wide and only becomes PDF
   zoom over the page area. */
const PINCH_K = 0.01;          // exp response: factor = e^(-deltaY * k)
const ZOOM_SETTLE_MS = 160;    // quiet time that commits a zoom session
let zoomGen = 0;               // bumped per settle; stale renders discard

/* The scale the user is LOOKING at: the live session target while one
   is open, the committed scale otherwise. Stepped zoom compounds on
   this, so three fast \u2318+ presses mean three steps, not one. */
function sessionTarget() {
  return state.zoom ? state.zoom.baseScale * state.zoom.factor : state.scale;
}

function viewportCenter() {
  const sr = document.getElementById("scroll").getBoundingClientRect();
  return [sr.left + sr.width / 2, sr.top + sr.height / 2];
}

function zoomTo(target, clientX, clientY, fit) {
  if (!state.doc) return;
  const scrollEl = document.getElementById("scroll");
  const pagesEl = document.getElementById("pages");
  if (!state.zoom) {
    const sr = scrollEl.getBoundingClientRect();
    const pr = pagesEl.getBoundingClientRect();   // transform-free here
    state.zoom = {
      baseScale: state.scale,
      factor: 1.0,
      hit: pageAndPoint(clientX, clientY),  // exact settle anchor
      vx: clientX - sr.left, vy: clientY - sr.top,
      cx0: scrollEl.scrollLeft + (clientX - sr.left),
      cy0: scrollEl.scrollTop + (clientY - sr.top),
      scrollLeft0: scrollEl.scrollLeft, scrollTop0: scrollEl.scrollTop,
      originX: clientX - pr.left, originY: clientY - pr.top,
      timer: null, fit: false,
    };
  }
  const p = state.zoom;
  p.fit = !!fit;
  const t = clampScale(target);
  p.factor = t / p.baseScale;
  pagesEl.style.transformOrigin = p.originX + "px " + p.originY + "px";
  pagesEl.style.transform = "scale(" + p.factor + ")";
  updateZoomReadout(t);
  if (p.timer) clearTimeout(p.timer);
  p.timer = setTimeout(zoomSettle, ZOOM_SETTLE_MS);
}

async function zoomSettle() {
  const p = state.zoom;
  if (!p) return;
  state.zoom = null;
  const pagesEl = document.getElementById("pages");
  pagesEl.style.transform = "";
  pagesEl.style.transformOrigin = "";
  if (!state.doc) return;                       // torn down mid-session
  const scrollEl = document.getElementById("scroll");
  // The user (or an overflow clamp) may have scrolled since capture:
  // the anchor's CURRENT viewport offset is the captured one shifted
  // by that delta — correct against where the point is NOW.
  const vx = p.vx - (scrollEl.scrollLeft - p.scrollLeft0);
  const vy = p.vy - (scrollEl.scrollTop - p.scrollTop0);
  const target = clampScale(p.baseScale * p.factor);
  if (Math.abs(target - state.scale) < 0.0005) {
    updateZoomReadout(state.scale);
    return;
  }
  state.userZoomed = !p.fit;
  state.scale = target;
  zoomGen++;
  await softRelayout();
  const div = p.hit ? state.pageDivs[p.hit.page0] : null;
  if (div) {
    // The anchored PDF point, in the NEW layout, back under the anchor.
    scrollEl.scrollLeft = div.offsetLeft + p.hit.xPt * state.scale - vx;
    scrollEl.scrollTop = div.offsetTop + p.hit.yPt * state.scale - vy;
  } else {
    // Anchor was over a gap: proportional correction is close enough.
    const r = target / p.baseScale;
    scrollEl.scrollLeft = p.cx0 * r - vx;
    scrollEl.scrollTop = p.cy0 * r - vy;
  }
  refreshVisibleFirst();
}

/* Resize the layout to state.scale WITHOUT dropping a pixel:
   placeholders just resize; rendered pages keep their old canvas,
   CSS-stretched into the new geometry (soft until refreshed), the
   text layer resized with it (spans track --scale-factor), and the
   annotation layers redrawn (cheap DOM). relayout() stays the
   teardown twin for panel RESIZES; zoom must never blank. */
async function softRelayout() {
  applyScaleFactor();
  const first = await state.doc.getPage(1);
  const base = first.getViewport({ scale: 1.0 });
  for (const d of state.pageDivs) {
    const num = parseInt(d.dataset.page, 10);
    const w = Math.floor(base.width * state.scale);
    const h = Math.floor(base.height * state.scale);
    d.style.width = w + "px";
    d.style.height = h + "px";
    const r = state.rendered.get(num);
    if (r && r.canvas) {
      r.canvas.style.width = w + "px";
      r.canvas.style.height = h + "px";
      if (r.textLayer) {
        r.textLayer.style.width = w + "px";
        r.textLayer.style.height = h + "px";
      }
      renderAnnotLayers(num, d);
    }
  }
}

/* Crisp replacement render for one already-rendered page, swapped in
   ONLY when fully drawn — the stretched old canvas keeps showing
   meanwhile (never blank-then-redraw). Superseded work (a newer
   settle, a scroll-away teardown) discards itself. */
async function refreshPage(num, div) {
  const gen = zoomGen;
  const entry = state.rendered.get(num);
  if (!entry || !entry.canvas || entry.refreshing || !div) return;
  entry.refreshing = true;
  let textLayer = null;
  try {
    const page = await state.doc.getPage(num);
    const viewport = page.getViewport({ scale: state.scale });
    const canvas = document.createElement("canvas");
    canvas.className = "pg";
    const ratio = window.devicePixelRatio || 1;
    canvas.width = Math.floor(viewport.width * ratio);
    canvas.height = Math.floor(viewport.height * ratio);
    canvas.style.width = Math.floor(viewport.width) + "px";
    canvas.style.height = Math.floor(viewport.height) + "px";
    await page.render({
      canvasContext: canvas.getContext("2d"), viewport: viewport,
      transform: ratio !== 1 ? [ratio, 0, 0, ratio, 0, 0] : null,
      annotationMode: pdfjsLib.AnnotationMode.DISABLE,
    }).promise;
    // The replacement text layer renders attached-but-hidden: pdf.js
    // measures spans against computed style, and a detached node has
    // none (renderPage's documented rule).
    textLayer = document.createElement("div");
    textLayer.className = "textLayer";
    textLayer.style.width = Math.floor(viewport.width) + "px";
    textLayer.style.height = Math.floor(viewport.height) + "px";
    textLayer.style.visibility = "hidden";
    div.appendChild(textLayer);
    const textContent = await page.getTextContent();
    const task = pdfjsLib.renderTextLayer({
      textContentSource: textContent,
      container: textLayer,
      viewport: viewport,
    });
    if (task && task.promise) { try { await task.promise; } catch (e) {} }
    if (gen !== zoomGen || state.rendered.get(num) !== entry
        || !div.isConnected) {
      try { div.removeChild(textLayer); } catch (e) {}
      return;   // superseded — a newer settle or a teardown owns it now
    }
    div.style.width = Math.floor(viewport.width) + "px";
    div.style.height = Math.floor(viewport.height) + "px";
    try { div.replaceChild(canvas, entry.canvas); }
    catch (e) { div.appendChild(canvas); }
    if (entry.textLayer) {
      try { div.removeChild(entry.textLayer); } catch (e) {}
    }
    textLayer.style.visibility = "";
    const spans = Array.from(textLayer.querySelectorAll("span"));
    state.rendered.set(num, { canvas, textLayer, spans });
    renderAnnotLayers(num, div);
    if (state.find.matches.length) highlightCurrentMatchIfVisible();
  } catch (e) {
    if (textLayer) { try { div.removeChild(textLayer); } catch (e2) {} }
    post("log:refresh " + num + " failed: " + e.message);
  } finally {
    entry.refreshing = false;
  }
}

function refreshVisibleFirst() {
  const scrollEl = document.getElementById("scroll");
  const top = scrollEl.scrollTop, bot = top + scrollEl.clientHeight;
  const visible = [], rest = [];
  for (const num of state.rendered.keys()) {
    const d = state.pageDivs[num - 1];
    if (!d) continue;
    const inView = d.offsetTop < bot && d.offsetTop + d.offsetHeight > top;
    (inView ? visible : rest).push(num);
  }
  visible.sort((a, b) => a - b);
  (async () => {
    for (const n of visible) await refreshPage(n, state.pageDivs[n - 1]);
    for (const n of rest) await refreshPage(n, state.pageDivs[n - 1]);
  })();
}

document.addEventListener("wheel", (ev) => {
  if (!ev.ctrlKey) return;    // plain two-finger scroll stays untouched
  ev.preventDefault();        // the frame never zooms, anywhere on it
  if (!state.doc) return;
  if (!document.getElementById("scroll").contains(ev.target)) return;
  zoomTo(sessionTarget() * Math.exp(-ev.deltaY * PINCH_K),
         ev.clientX, ev.clientY, false);
}, { passive: false });

/* WebKit-lineage gesture events: if the engine ever synthesizes them,
   cancelling keeps a second zoom path from double-firing. */
for (const g of ["gesturestart", "gesturechange", "gestureend"]) {
  document.addEventListener(g, (ev) => ev.preventDefault());
}

/* ==== annotation toolbar (K-116) =================================== */
/* Highlight and Add Text lived only in the context menu — invisible
   until right-clicked (the live complaint). The annobar is their
   always-visible twin; the menu items stay.

   Same selection rule as the context menu (documented there): a
   trusted mousedown over non-editable UI collapses the selection
   BEFORE click fires, so the bar cancels mousedown — clicking
   Highlight can then consume the selection it was aimed at, and the
   buttons never steal focus from the page. */
document.getElementById("annobar").addEventListener(
  "mousedown", (ev) => ev.preventDefault());

function setTool(tool) {
  state.tool = state.tool === tool ? null : tool;
  for (const [id, name] of [["abHl", "hl"], ["abText", "text"]]) {
    const b = document.getElementById(id);
    b.classList.toggle("active", state.tool === name);
    b.setAttribute("aria-pressed", String(state.tool === name));
  }
  document.getElementById("scroll").classList.toggle(
    "textTool", state.tool === "text");
}

document.getElementById("abHl").addEventListener("click", () => {
  const arming = state.tool !== "hl";
  setTool("hl");
  // Preview's move: arming with a live selection highlights it now.
  if (arming && selectionRectMap()) addHighlightFromSelection();
});
document.getElementById("abText").addEventListener(
  "click", () => setTool("text"));
document.getElementById("abZoomOut").addEventListener(
  "click", () => window.klausSetZoom(1 / 1.2));
document.getElementById("abZoomIn").addEventListener(
  "click", () => window.klausSetZoom(1.2));
document.getElementById("abZoomFit").addEventListener(
  "click", () => window.klausZoomReset());

/* Highlight tool: releasing a selection highlights it immediately.
   selectionRectMap() gates the call — a bare click while armed must
   never fire the "select text first" toast. The 0-timeout lets Blink
   finalize the selection after mouseup. */
document.addEventListener("mouseup", () => {
  if (state.tool !== "hl") return;
  setTimeout(() => {
    if (state.tool === "hl" && selectionRectMap()) {
      addHighlightFromSelection();
    }
  }, 0);
});

/* Text tool: one placement per arm — the click posts the page-point
   over the bridge (Python clamps and owns the record) and the tool
   disarms so the non-modal dialog flow cannot stack. */
document.getElementById("scroll").addEventListener("click", (ev) => {
  if (state.tool !== "text" || ev.button !== 0) return;
  const hit = pageAndPoint(ev.clientX, ev.clientY);
  if (!hit) return;
  ev.preventDefault();
  ev.stopPropagation();
  setTool(null);
  postB64("text-add", { page: hit.page0, x: hit.xPt, y: hit.yPt });
});

/* ==== find ========================================================= */
async function ensurePageTexts() {
  if (state.pageTexts) return state.pageTexts;
  const out = [];
  for (let i = 1; i <= state.doc.numPages; i++) {
    const page = await state.doc.getPage(i);
    const tc = await page.getTextContent();
    let str = "";
    const items = [];
    for (const it of tc.items) {
      items.push({ start: str.length, len: it.str.length });
      str += it.str;
      if (it.hasEOL) str += "\n";
    }
    out.push({ str, items });
  }
  state.pageTexts = out;
  return out;
}

function showFindBar() {
  document.getElementById("findbar").classList.add("visible");
  const inp = document.getElementById("findinput");
  inp.focus(); inp.select();
}
function hideFindBar() {
  document.getElementById("findbar").classList.remove("visible");
  clearFindHighlight();
  state.find = { query: "", matches: [], index: -1 };
  document.getElementById("findcount").textContent = "";
}

let findTimer = null;
document.getElementById("findinput").addEventListener("input", () => {
  if (findTimer) clearTimeout(findTimer);
  findTimer = setTimeout(runFind, 250);
});
document.getElementById("findnext").addEventListener("click", () => stepFind(1));
document.getElementById("findprev").addEventListener("click", () => stepFind(-1));
document.getElementById("findclose").addEventListener("click", hideFindBar);
document.getElementById("findinput").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") { ev.preventDefault(); stepFind(ev.shiftKey ? -1 : 1); }
  else if (ev.key === "Escape") { ev.preventDefault(); hideFindBar(); }
});

async function runFind() {
  const q = document.getElementById("findinput").value.trim().toLowerCase();
  clearFindHighlight();
  state.find = { query: q, matches: [], index: -1 };
  const countEl = document.getElementById("findcount");
  if (!q || !state.doc) { countEl.textContent = ""; return; }
  const texts = await ensurePageTexts();
  const matches = [];
  for (let p = 0; p < texts.length; p++) {
    const hay = texts[p].str.toLowerCase();
    let at = hay.indexOf(q);
    while (at !== -1) {
      // owning text item = the one whose range contains the match start
      let itemIdx = 0;
      const items = texts[p].items;
      for (let k = 0; k < items.length; k++) {
        if (items[k].start <= at && at < items[k].start + Math.max(1, items[k].len)) {
          itemIdx = k; break;
        }
        if (items[k].start > at) break;
        itemIdx = k;
      }
      matches.push({ page0: p, itemIdx });
      at = hay.indexOf(q, at + Math.max(1, q.length));
    }
  }
  state.find.matches = matches;
  countEl.textContent = matches.length ? `1 / ${matches.length}` : "0 matches";
  if (matches.length) { state.find.index = 0; jumpToMatch(); }
}

function stepFind(dir) {
  const f = state.find;
  if (!f.matches.length) return;
  f.index = (f.index + dir + f.matches.length) % f.matches.length;
  document.getElementById("findcount").textContent =
      `${f.index + 1} / ${f.matches.length}`;
  jumpToMatch();
}

function clearFindHighlight() {
  for (const el of document.querySelectorAll(".findCurrent")) {
    el.classList.remove("findCurrent");
  }
}

async function jumpToMatch() {
  const m = state.find.matches[state.find.index];
  if (!m) return;
  const div = state.pageDivs[m.page0];
  if (!div) return;
  const r = state.rendered.get(m.page0 + 1);
  if (!r || !r.spans) {
    div.scrollIntoView({ block: "center" });
    await renderPage(m.page0 + 1, div);
  }
  highlightCurrentMatchIfVisible(true);
}

function highlightCurrentMatchIfVisible(scrollTo) {
  clearFindHighlight();
  const m = state.find.matches[state.find.index];
  if (!m) return;
  const r = state.rendered.get(m.page0 + 1);
  if (!r || !r.spans || !r.spans.length) return;
  const span = r.spans[Math.min(m.itemIdx, r.spans.length - 1)];
  if (!span) return;
  span.classList.add("findCurrent");
  if (scrollTo) span.scrollIntoView({ block: "center" });
}

/* ==== thumbnails =================================================== */
function buildThumbs() {
  const el = document.getElementById("thumbs");
  el.textContent = "";
  if (!state.doc) return;
  if (state.thumbObserver) state.thumbObserver.disconnect();
  state.thumbObserver = new IntersectionObserver((entries) => {
    for (const en of entries) {
      if (en.isIntersecting) renderThumb(parseInt(en.target.dataset.page, 10));
    }
  }, { root: el, rootMargin: "100% 0px" });
  for (let i = 1; i <= state.doc.numPages; i++) {
    const t = document.createElement("div");
    t.className = "thumb";
    t.dataset.page = String(i);
    const num = document.createElement("div");
    num.className = "tnum";
    num.textContent = String(i);
    t.appendChild(num);
    t.addEventListener("click", () => window.klausGoToPage(i));
    el.appendChild(t);
    state.thumbObserver.observe(t);
  }
  markCurrentThumb(state.currentPage || 1);
}

async function renderThumb(num) {
  const t = document.querySelector(`.thumb[data-page="${num}"]`);
  if (!t || t.querySelector("canvas") || !state.doc) return;
  try {
    const page = await state.doc.getPage(num);
    const base = page.getViewport({ scale: 1.0 });
    const scale = 140 / base.width;
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement("canvas");
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport, annotationMode: pdfjsLib.AnnotationMode.DISABLE }).promise;
    t.insertBefore(canvas, t.firstChild);
  } catch (e) { post("log:thumb " + num + " failed: " + e.message); }
}

function markCurrentThumb(page) {
  for (const el of document.querySelectorAll(".thumb.current")) {
    el.classList.remove("current");
  }
  const t = document.querySelector(`.thumb[data-page="${page}"]`);
  if (t) t.classList.add("current");
}

window.klausToggleThumbs = function () {
  const el = document.getElementById("thumbs");
  el.classList.toggle("visible");
  if (el.classList.contains("visible")) markCurrentThumb(state.currentPage || 1);
};

/* ==== keyboard ===================================================== */
document.addEventListener("keydown", (ev) => {
  const mod = ev.metaKey || ev.ctrlKey;
  if (mod && !ev.shiftKey && !ev.altKey && ev.key.toLowerCase() === "f") {
    ev.preventDefault(); showFindBar();
  } else if (mod && ev.shiftKey && ["h", "a"].includes(ev.key.toLowerCase())) {
    ev.preventDefault(); addHighlightFromSelection();
  } else if (mod && ev.altKey && ev.key.toLowerCase() === "g") {
    ev.preventDefault(); post("goto-request");
  } else if (mod && !ev.shiftKey && ev.key.toLowerCase() === "g") {
    ev.preventDefault(); stepFind(1);
  } else if (mod && ev.shiftKey && ev.key.toLowerCase() === "g") {
    ev.preventDefault(); stepFind(-1);
  } else if (mod && (ev.key === "=" || ev.key === "+")) {
    ev.preventDefault(); window.klausSetZoom(1.2);
  } else if (mod && ev.key === "-") {
    ev.preventDefault(); window.klausSetZoom(1 / 1.2);
  } else if (mod && ev.key === "0") {
    ev.preventDefault(); window.klausZoomReset();
  } else if (ev.key === "Escape") {
    hideMenu();
    if (state.tool) setTool(null);
    if (document.getElementById("findbar").classList.contains("visible")) {
      hideFindBar();
    }
  }
});

/* ==== API called from Python ======================================= */
window.klausGoToPage = function (num) {
  const d = state.pageDivs[num - 1];
  if (d) d.scrollIntoView({ block: "start" });
};

window.klausSetZoom = function (factor) {
  if (!state.doc) return;
  // Through the zoom session: instant transform feedback, one settled
  // re-render behind rapid steps, anchored at the viewport centre.
  // userZoomed is committed by the settle.
  const c = viewportCenter();
  zoomTo(sessionTarget() * factor, c[0], c[1], false);
};

window.klausZoomReset = async function () {
  if (!state.doc) return;
  const first = await state.doc.getPage(1);
  const base = first.getViewport({ scale: 1.0 });
  const fit = clampScale(
    (document.getElementById("scroll").clientWidth - 24) / base.width
  );
  const c = viewportCenter();
  zoomTo(fit, c[0], c[1], true);   // fit: settle clears userZoomed
};

async function rezoom(keepPage) {
  await relayout();
  window.klausGoToPage(keepPage);
}

/* Teardown re-layout at state.scale, scroll untouched — the width
   REFIT path (ResizeObserver -> rezoom). Zoom never comes here: its
   settle rides softRelayout + refreshPage so pages are never blanked. */
async function relayout() {
  applyScaleFactor();
  const first = await state.doc.getPage(1);
  const base = first.getViewport({ scale: 1.0 });
  for (const d of state.pageDivs) {
    teardownPage(parseInt(d.dataset.page, 10), d);
    d.style.width = Math.floor(base.width * state.scale) + "px";
    d.style.height = Math.floor(base.height * state.scale) + "px";
  }
  state.rendered.clear();
}

window.klausScrollTo = function (y) {
  document.getElementById("scroll").scrollTop = y;
};

window.klausScrollPosition = function () {
  return document.getElementById("scroll").scrollTop;
};

post("boot");
</script>
