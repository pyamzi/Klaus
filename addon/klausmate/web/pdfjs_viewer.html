<script>
"use strict";
/* global pdfjsLib */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "/_addons/__ADDON__/web/pdfjs/pdf.worker.min.js";

/* One clamp for every zoom writer (fit, ⌘ keys, menu, toolbar, pinch)
   — a preview that promises a scale the settle refuses would jump. */
const MIN_SCALE = 0.25, MAX_SCALE = 4.0;
function clampScale(s) { return Math.max(MIN_SCALE, Math.min(MAX_SCALE, s)); }

const state = {
  doc: null,
  scale: 1.0,
  userZoomed: false,
  pageDivs: [],
  rendered: new Map(),   // pageNum -> {canvas, textLayer, spans[]}
  observer: null,
  thumbObserver: null,
  currentPage: 0,
  b64parts: [],
  annots: [],            // canonical records, pushed from Python
  pageTexts: null,       // [{str, items:[{start,len}]}] lazily built for find
  find: { query: "", matches: [], index: -1 },
  marquee: null,         // {page, x0, y0} while alt-dragging
  persistMarquee: null,  // {page0,x,y,w,h,dataUrl} kept after release (K-100)
  zoom: null,            // live zoom session — pinch or stepped (zoomTo)
  tool: null,            // "hl" | "text" | null — annobar mode
  ink: "yellow",         // selected highlight ink — a theme --ink-* NAME
  tink: "black",         // selected TEXT ink — a --tink-* NAME (K-150)
  tsize: 12,             // selected text size in points (K-150)
  textEdit: null,        // live in-place editor (K-150), see openTextEdit
  textDrag: null,        // {x0,y0,ax,ay} while the grip is being dragged
};

function post(msg) {
  try { pycmd("klausmate_pdfjs:" + msg); } catch (e) { /* headless */ }
}

/* pdf.js 3.x CONTRACT: the text layer sizes its glyph spans with
   calc(var(--scale-factor) * ...). Without this property the calc() is
   invalid, every span falls back to the default font size, and the
   selection layer no longer matches the painted page (the exact
   misalignment + broken-highlight bug found live). Must track
   state.scale everywhere it changes. */
function applyScaleFactor() {
  document.getElementById("pages").style.setProperty(
    "--scale-factor", String(state.scale));
  updateZoomReadout(state.scale);
}

/* The annobar's live % — fed from applyScaleFactor (every committed
   scale change funnels through it) and directly during a pinch, whose
   interim scale exists only as a CSS transform. */
function updateZoomReadout(scale) {
  const el = document.getElementById("abZoomPct");
  if (el) el.textContent = Math.round(scale * 100) + "%";
}
function postB64(action, obj) {
  const json = JSON.stringify(obj);
  post(action + ":" + btoa(unescape(encodeURIComponent(json))));
}

/* ==== feed ========================================================= */
window.klausPdfChunk = function (part) { state.b64parts.push(part); };
window.klausPdfLoad = function () {
  const b64 = state.b64parts.join("");
  state.b64parts = [];
  const raw = atob(b64);
  const bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  openDocument(bytes);
};
window.klausPdfError = function (text) {
  const el = document.getElementById("error");
  el.textContent = text;
  el.style.display = "block";
};

async function openDocument(bytes) {
  teardown();
  try {
    state.doc = await pdfjsLib.getDocument({ data: bytes }).promise;
  } catch (e) {
    window.klausPdfError("Could not open this PDF: " + e.message);
    post("log:open failed: " + e.message);
    return;
  }
  post("count:" + state.doc.numPages);
  await buildPlaceholders();
  buildThumbs();
  observePages();
  post("ready");
}

async function availWidth() {
  // Host panel may not be laid out yet (caught live: zero width at load
  // rendered everything at the 0.25 floor). Wait up to ~1s.
  const el = document.getElementById("scroll");
  for (let i = 0; i < 60 && el.clientWidth < 60; i++) {
    await new Promise((r) => requestAnimationFrame(r));
  }
  return Math.max(60, el.clientWidth) - 24;
}

async function buildPlaceholders() {
  const pagesEl = document.getElementById("pages");
  pagesEl.textContent = "";
  state.pageDivs = [];
  const first = await state.doc.getPage(1);
  const base = first.getViewport({ scale: 1.0 });
  const avail = await availWidth();
  state.scale = clampScale(avail / base.width);
  applyScaleFactor();
  for (let i = 1; i <= state.doc.numPages; i++) {
    const div = document.createElement("div");
    div.className = "page";
    div.dataset.page = String(i);
    div.style.width = Math.floor(base.width * state.scale) + "px";
    div.style.height = Math.floor(base.height * state.scale) + "px";
    pagesEl.appendChild(div);
    state.pageDivs.push(div);
  }
}

new ResizeObserver(async () => {
  if (!state.doc || state.userZoomed) return;
  const first = await state.doc.getPage(1);
  const base = first.getViewport({ scale: 1.0 });
  const target = clampScale(
    (document.getElementById("scroll").clientWidth - 24) / base.width
  );
  if (Math.abs(target - state.scale) / state.scale > 0.02) {
    state.scale = target;
    rezoom(state.currentPage || 1);
  }
}).observe(document.getElementById("scroll"));

function observePages() {
  if (state.observer) state.observer.disconnect();
  state.observer = new IntersectionObserver(onIntersect, {
    root: document.getElementById("scroll"),
    rootMargin: "150% 0px",
  });
  for (const d of state.pageDivs) state.observer.observe(d);
  const scroll = document.getElementById("scroll");
  scroll.addEventListener("scroll", trackCurrentPage, { passive: true });
  scroll.addEventListener("scroll", scheduleScrollReport, { passive: true });
}

function onIntersect(entries) {
  for (const en of entries) {
    const idx = parseInt(en.target.dataset.page, 10);
    if (en.isIntersecting) renderPage(idx, en.target);
    else teardownPage(idx, en.target);
  }
}

async function renderPage(num, div) {
  if (state.rendered.has(num) || !state.doc) return;
  state.rendered.set(num, {});   // claim before await (re-entrancy)
  try {
    const page = await state.doc.getPage(num);
    const viewport = page.getViewport({ scale: state.scale });
    div.style.width = Math.floor(viewport.width) + "px";
    div.style.height = Math.floor(viewport.height) + "px";
    const canvas = document.createElement("canvas");
    canvas.className = "pg";
    const ratio = window.devicePixelRatio || 1;
    canvas.width = Math.floor(viewport.width * ratio);
    canvas.height = Math.floor(viewport.height * ratio);
    canvas.style.width = Math.floor(viewport.width) + "px";
    canvas.style.height = Math.floor(viewport.height) + "px";
    const ctx = canvas.getContext("2d");
    await page.render({
      canvasContext: ctx, viewport: viewport,
      transform: ratio !== 1 ? [ratio, 0, 0, ratio, 0, 0] : null,
      annotationMode: pdfjsLib.AnnotationMode.DISABLE,
    }).promise;
    const textLayer = document.createElement("div");
    textLayer.className = "textLayer";
    textLayer.style.width = Math.floor(viewport.width) + "px";
    textLayer.style.height = Math.floor(viewport.height) + "px";
    // Attach BEFORE rendering the text layer: pdf.js measures each
    // span's real width against its computed style to derive the
    // per-span scaleX correction, and a detached node has no computed
    // style — glyphs drift horizontally without this.
    div.appendChild(canvas);
    div.appendChild(textLayer);
    const textContent = await page.getTextContent();
    const task = pdfjsLib.renderTextLayer({
      textContentSource: textContent,
      container: textLayer,
      viewport: viewport,
    });
    if (task && task.promise) { try { await task.promise; } catch (e) {} }
    const spans = Array.from(textLayer.querySelectorAll("span"));
    state.rendered.set(num, { canvas, textLayer, spans });
    renderAnnotLayers(num, div);
    if (state.find.matches.length) highlightCurrentMatchIfVisible();
    if (Math.abs(viewport.scale - state.scale) > 0.0005) {
      // A zoom settled while this render was in flight — its output
      // is stale-scale. refreshPage redraws crisp, fixes the div size.
      refreshPage(num, div);
    }
  } catch (e) {
    state.rendered.delete(num);
    post("log:render " + num + " failed: " + e.message);
  }
}

function teardownPage(num, div) {
  const r = state.rendered.get(num);
  if (!r || !r.canvas) return;   // never tear down a mid-render claim
  for (const cls of ["canvas.pg", ".textLayer", ".hlLayer", ".noteLayer"]) {
    const el = div.querySelector(cls);
    if (el) { try { div.removeChild(el); } catch (e) {} }
  }
  state.rendered.delete(num);
}

function teardown() {
  if (state.observer) state.observer.disconnect();
  state.rendered.clear();
  state.pageDivs = [];
  state.annots = [];
  state.pageTexts = null;
  state.persistMarquee = null;   // its overlay dies with #pages below
  state.textEdit = null;         // so does the editor box (K-150)
  state.textDrag = null;
  state.find = { query: "", matches: [], index: -1 };
  document.getElementById("pages").textContent = "";
  document.getElementById("thumbs").textContent = "";
  document.getElementById("error").style.display = "none";
  state.doc = null;
  state.currentPage = 0;
}

function trackCurrentPage() {
  const scroll = document.getElementById("scroll");
  const mid = scroll.scrollTop + scroll.clientHeight / 3;
  let page = 1;
  for (const d of state.pageDivs) {
    if (d.offsetTop <= mid) page = parseInt(d.dataset.page, 10);
    else break;
  }
  if (page !== state.currentPage) {
    state.currentPage = page;
    post("page:" + page + ":" + (state.doc ? state.doc.numPages : 0));
    markCurrentThumb(page);
  }
}

let scrollReportTimer = null;
function scheduleScrollReport() {
  if (scrollReportTimer) clearTimeout(scrollReportTimer);
  scrollReportTimer = setTimeout(() => {
    post("scroll:" + Math.round(document.getElementById("scroll").scrollTop));
  }, 300);
}

/* ==== annotations (records owned by Python) ======================== */
window.klausSetAnnotations = function (records) {
  state.annots = Array.isArray(records) ? records : [];
  for (const [num, r] of state.rendered) {
    if (r && r.canvas) {
      renderAnnotLayers(num, state.pageDivs[num - 1]);
    }
  }
};

function hexToRgba(hex, alpha) {
  try {
    const h = String(hex || "#fadc50").replace("#", "");
    const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16),
          b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  } catch (e) { return "rgba(250, 220, 80, " + alpha + ")"; }
}

function renderAnnotLayers(num, div) {
  if (!div) return;
  for (const cls of [".hlLayer", ".noteLayer"]) {
    const old = div.querySelector(cls);
    if (old) div.removeChild(old);
  }
  const hlLayer = document.createElement("div");
  hlLayer.className = "hlLayer";
  const noteLayer = document.createElement("div");
  noteLayer.className = "noteLayer";
  const s = state.scale;
  for (const rec of state.annots) {
    if ((rec.page | 0) !== num - 1) continue;   // records are 0-based
    const rects = rec.rects || [];
    if (rec.kind === "text" && rects.length) {
      /* The record being edited is drawn by its editor, not here: the
         static twin would ghost underneath the live box, one glyph
         off, on every pass (K-150). */
      if (state.textEdit && state.textEdit.id === rec.id) continue;
      const [x, y, w, h] = rects[0];
      const t = document.createElement("div");
      t.className = "hltext";
      t.textContent = String(rec.text || "");
      t.style.left = x * s + "px";
      t.style.top = y * s + "px";
      t.style.width = w * s + "px";
      t.style.height = h * s + "px";
      t.style.color = String(rec.color || "#000000");
      t.style.fontSize = Math.max(6, (parseFloat(rec.size) || 12) * s) + "px";
      hlLayer.appendChild(t);
    } else {
      let first = null;
      for (const r of rects) {
        const [x, y, w, h] = r;
        const d = document.createElement("div");
        d.className = "hl";
        d.style.left = x * s + "px";
        d.style.top = y * s + "px";
        d.style.width = w * s + "px";
        d.style.height = h * s + "px";
        d.style.background = hexToRgba(rec.color, 0.43);
        hlLayer.appendChild(d);
        if (!first) first = r;
      }
      const note = String(rec.note || "").trim();
      if (note && first) {
        const a = document.createElement("div");
        a.className = "noteAnchor";
        a.textContent = "✎";
        a.title = note;
        a.style.left = (first[0] + first[2]) * s - 8 + "px";
        a.style.top = first[1] * s - 8 + "px";
        a.dataset.hlid = String(rec.id || "");
        a.addEventListener("click", (ev) => {
          ev.stopPropagation();
          postB64("note-edit", { id: a.dataset.hlid });
        });
        noteLayer.appendChild(a);
      }
    }
  }
  div.appendChild(hlLayer);
  div.appendChild(noteLayer);
  /* Every overlay pass (render, refresh, zoom relayout) re-lands the
     persisted marquee at the new scale (K-100). The open text editor
     rides the same rule — it is never rebuilt, only re-landed, which
     is what keeps the caret alive across this pass (K-150). */
  if (state.persistMarquee && state.persistMarquee.page0 === num - 1) {
    positionPersistMarquee();
  }
  if (state.textEdit && state.textEdit.page0 === num - 1) {
    positionTextEdit();
  }
}

/* Rects on one line, folded into one rect per run (K-149).

   Range.getClientRects() returns BOTH a span's border box AND its text
   node's quad whenever the range covers that span completely — and
   pdf.js's text layer is exactly one shrink-wrapped span per text
   item, so an ordinary three-line drag returns SIX rects. Both clear
   the sub-pixel guard below, both used to become .hl divs, and two
   layers of the 43%-alpha paint composite to 67.5%: that was the
   "double-highlighted" look, from one drag. Measured in Blink: the
   border box [21,21,110.28,16] nested inside the quad
   [21,19.5,110.28,18.5].

   Same-line rects that overlap horizontally (or sit within GAP of each
   other, stitching a line's several spans into one box) union into
   their outer box; duplicates and containment fall out of that.

   Where the fix actually BITES is pdfjs_viewer.merge_rects, running the
   same rule on the Python side: the page never paints a highlight
   optimistically — state.annots only ever arrives through
   klausSetAnnotations — so what you see is always the canonical record.
   This half keeps the PAYLOAD honest (one rect per line instead of two
   on the wire, for selections that can run to dozens of lines) and
   gives that rule a second implementation the tests pin against the
   first, so neither can drift. JS is never trusted; Python re-merges
   whatever arrives. */
function mergeRects(rects) {
  const GAP = 0.75;
  const sameLine = (a, b) => {
    const top = Math.max(a[1], b[1]);
    const bottom = Math.min(a[1] + a[3], b[1] + b[3]);
    const shorter = Math.min(a[3], b[3]);
    return shorter > 0 && (bottom - top) > shorter * 0.5;
  };
  let cur = rects.slice(), merged = true;
  while (merged) {
    merged = false;
    cur.sort((a, b) => a[1] - b[1] || a[0] - b[0]);
    const out = [];
    for (const r of cur) {
      let host = null;
      for (const c of out) {
        if (sameLine(c, r) &&
            r[0] <= c[0] + c[2] + GAP && c[0] <= r[0] + r[2] + GAP) {
          host = c; break;
        }
      }
      if (!host) { out.push(r); continue; }
      const x0 = Math.min(host[0], r[0]), y0 = Math.min(host[1], r[1]);
      const x1 = Math.max(host[0] + host[2], r[0] + r[2]);
      const y1 = Math.max(host[1] + host[3], r[1] + r[3]);
      host[0] = x0; host[1] = y0; host[2] = x1 - x0; host[3] = y1 - y0;
      merged = true;
    }
    cur = out;
  }
  cur.sort((a, b) => a[1] - b[1] || a[0] - b[0]);
  return cur;
}

/* Selection -> {pageIndex0: [[x,y,w,h] page pts]}. A rect belongs to
   the page containing its CENTER (full containment was too strict —
   sub-pixel span overhang silently dropped rects), then gets clamped
   into that page's box. Each page's rects are then merged (above) so
   one drag mints one layer of paint. */
function selectionRectMap() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const map = {};
  const s = state.scale;
  for (let i = 0; i < sel.rangeCount; i++) {
    for (const cr of sel.getRangeAt(i).getClientRects()) {
      if (cr.width < 1 || cr.height < 1) continue;
      const cx = cr.left + cr.width / 2, cy = cr.top + cr.height / 2;
      for (const div of state.pageDivs) {
        const pr = div.getBoundingClientRect();
        if (cx >= pr.left && cx <= pr.right && cy >= pr.top && cy <= pr.bottom) {
          const page = parseInt(div.dataset.page, 10) - 1;
          const x0 = Math.max(cr.left, pr.left), y0 = Math.max(cr.top, pr.top);
          const x1 = Math.min(cr.right, pr.right), y1 = Math.min(cr.bottom, pr.bottom);
          if (x1 - x0 >= 1 && y1 - y0 >= 1) {
            (map[page] = map[page] || []).push([
              (x0 - pr.left) / s, (y0 - pr.top) / s,
              (x1 - x0) / s, (y1 - y0) / s,
            ]);
          }
          break;
        }
      }
    }
  }
  for (const page of Object.keys(map)) map[page] = mergeRects(map[page]);
  return Object.keys(map).length ? map : null;
}

/* The selected ink's hex, read back out of the theme custom property
   that painted its swatch (theme.css_vars emits --ink-<name>) — so the
   colour the user sees IS the colour that reaches the record, and no
   hex is spelled in this file. An unresolvable var sends nothing and
   Python falls back to its default yellow. */
function currentInk() {
  try {
    const v = getComputedStyle(document.documentElement)
      .getPropertyValue("--ink-" + state.ink).trim();
    return v || null;
  } catch (e) { return null; }
}

function addHighlightFromSelection() {
  const map = selectionRectMap();
  if (!map) { post("toast:" + btoa("Klaus: select text first, then highlight")); return; }
  postB64("hl-add", { pages: map, color: currentInk() });
  window.getSelection().removeAllRanges();
}

/* Task 10 (K-196): report the live text selection to Python so
   viewer_context (and the assistant dock reading it) knows what the
   user has highlighted with the mouse, not just what they've inked.
   Debounced — the DOM event this listens for below fires on every
   caret move during a drag. */
let _selT = null;
document.addEventListener("selectionchange", () => {
  clearTimeout(_selT);
  _selT = setTimeout(() => postB64("sel", { text: String(window.getSelection() || "") }), 150);
});

/* Topmost highlight record under (page0, xPt, yPt), like _highlight_at. */
function highlightAt(page0, xPt, yPt, tol) {
  tol = tol || 3;
  for (let i = state.annots.length - 1; i >= 0; i--) {
    const rec = state.annots[i];
    if ((rec.page | 0) !== page0) continue;
    for (const r of rec.rects || []) {
      const [x, y, w, h] = r;
      if (x - tol <= xPt && xPt <= x + w + tol &&
          y - tol <= yPt && yPt <= y + h + tol) return rec;
    }
  }
  return null;
}

/* ==== clipboard helpers ============================================ */
function pageAndPoint(clientX, clientY) {
  for (const div of state.pageDivs) {
    const pr = div.getBoundingClientRect();
    if (clientX >= pr.left && clientX <= pr.right &&
        clientY >= pr.top && clientY <= pr.bottom) {
      return {
        div, page0: parseInt(div.dataset.page, 10) - 1,
        xPt: (clientX - pr.left) / state.scale,
        yPt: (clientY - pr.top) / state.scale,
      };
    }
  }
  return null;
}

async function copyPageImage(page0) {
  // Render offscreen at a fixed quality scale so the copy doesn't
  // depend on the current zoom (matches the native slide copy).
  try {
    const page = await state.doc.getPage(page0 + 1);
    const viewport = page.getViewport({ scale: 2.0 });
    const canvas = document.createElement("canvas");
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport, annotationMode: pdfjsLib.AnnotationMode.DISABLE }).promise;
    post("copy-image:" + canvas.toDataURL("image/png").split(",", 2)[1]);
  } catch (e) { post("log:copy page image failed: " + e.message); }
}

/* Offscreen render of one page region at fixed quality — shared by the
   clipboard copy and the persisted marquee's drag-out cache (K-100). */
async function renderRegionCanvas(page0, xPt, yPt, wPt, hPt) {
  const page = await state.doc.getPage(page0 + 1);
  const q = 2.0;
  const viewport = page.getViewport({ scale: q });
  const full = document.createElement("canvas");
  full.width = Math.floor(viewport.width);
  full.height = Math.floor(viewport.height);
  await page.render({ canvasContext: full.getContext("2d"), viewport, annotationMode: pdfjsLib.AnnotationMode.DISABLE }).promise;
  const out = document.createElement("canvas");
  out.width = Math.max(1, Math.floor(wPt * q));
  out.height = Math.max(1, Math.floor(hPt * q));
  out.getContext("2d").drawImage(
    full, xPt * q, yPt * q, wPt * q, hPt * q,
    0, 0, out.width, out.height);
  return out;
}

async function copyRegionImage(page0, xPt, yPt, wPt, hPt) {
  try {
    const out = await renderRegionCanvas(page0, xPt, yPt, wPt, hPt);
    post("copy-image:" + out.toDataURL("image/png").split(",", 2)[1]);
  } catch (e) { post("log:copy region failed: " + e.message); }
}

async function copyPageText(page0) {
  const texts = await ensurePageTexts();
  const t = (texts[page0] && texts[page0].str) || "";
  /* toast: menu-driven page capture confirms like the native viewer;
     plain selection copy stays silent (Preview-style). */
  postB64("copy-text", { text: t, toast: true });
}

/* ==== context menu ================================================= */
const ctxmenu = document.getElementById("ctxmenu");
function hideMenu() { ctxmenu.style.display = "none"; }
/* Cancel mousedown anywhere in the menu so the text selection SURVIVES
   until the click handler runs. Blink collapses the selection on a
   trusted mousedown over a non-editable element, and it does so BEFORE
   click fires — so every selection-dependent item ("Highlight", "Copy",
   "Copy Selection as Image") saw an empty selection and behaved as
   though nothing had been selected. "Highlight" reported "select text
   first" on a selection the menu had just used to decide to offer the
   item at all, which is what made highlighting look completely broken.
   Verified in a real Blink engine with actual mouse input: click-only
   wiring reads the selection as collapsed, this listener keeps it alive.
   preventDefault on mousedown suppresses only the focus/collapse default
   — click still fires, and the items are plain divs with nothing to
   focus. */
ctxmenu.addEventListener("mousedown", (ev) => ev.preventDefault());
document.addEventListener("click", hideMenu);
document.addEventListener("scroll", hideMenu, true);

document.getElementById("scroll").addEventListener("contextmenu", (ev) => {
  const hit = pageAndPoint(ev.clientX, ev.clientY);
  if (!hit) return;
  ev.preventDefault();
  const sel = window.getSelection();
  const hasSel = sel && !sel.isCollapsed && String(sel).trim().length > 0;
  const rec = highlightAt(hit.page0, hit.xPt, hit.yPt);
  const items = [];
  if (hasSel) {
    items.push(["Copy", () => postB64("copy-text", { text: String(sel) })]);
    items.push(["Copy Selection as Image", () => {
      const map = selectionRectMap();
      if (!map) return;
      const page0 = parseInt(Object.keys(map)[0], 10);
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      for (const [x, y, w, h] of map[page0]) {
        x0 = Math.min(x0, x); y0 = Math.min(y0, y);
        x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h);
      }
      copyRegionImage(page0, x0, y0, x1 - x0, y1 - y0);
    }]);
    items.push(["Highlight", addHighlightFromSelection]);
    items.push(null);
  } else if (state.persistMarquee) {
    /* Native parity (K-100): while a marquee stands, the menu re-offers
       its copy — the native menu's marquee_act, same label. The region
       is frozen into the closure so the menu press clearing state (it
       cannot: ctxmenu lives outside #scroll) could never blank it. */
    const pm = state.persistMarquee;
    items.push(["Copy Selection as Image",
                () => copyRegionImage(pm.page0, pm.x, pm.y, pm.w, pm.h)]);
    items.push(null);
  }
  if (rec) {
    if (rec.kind === "text") {
      /* The menu's twin of double-clicking the box (K-150). */
      items.push(["Edit Text…", () => openTextEdit(
        rec.page | 0, rec.rects[0][0], rec.rects[0][1], rec)]);
      items.push(["Remove Text", () => postB64("hl-remove", { id: rec.id })]);
    } else {
      const hasNote = String(rec.note || "").trim().length > 0;
      items.push([hasNote ? "Edit note…" : "Add note…",
                  () => postB64("note-edit", { id: rec.id })]);
      items.push(["Remove Highlight", () => postB64("hl-remove", { id: rec.id })]);
    }
    items.push(null);
  }
  items.push(["Copy Page Text", () => copyPageText(hit.page0)]);
  items.push(["Copy Slide as Image", () => copyPageImage(hit.page0)]);
  items.push(null);
  /* Zoom lived only on ⌘+/−/0 with no visible affordance anywhere
     (critique P3) — the menu is its discoverable twin. */
  items.push(["Zoom In\u2002\u2318+", () => window.klausSetZoom(1.1)]);
  items.push(["Zoom Out\u2002\u2318\u2212", () => window.klausSetZoom(1 / 1.1)]);
  items.push(["Actual Size\u2002\u23180", () => window.klausZoomReset()]);
  ctxmenu.textContent = "";
  for (const it of items) {
    if (it === null) {
      const s = document.createElement("div"); s.className = "sep";
      ctxmenu.appendChild(s); continue;
    }
    const mi = document.createElement("div");
    mi.className = "mi"; mi.textContent = it[0];
    mi.addEventListener("click", (e) => { e.stopPropagation(); hideMenu(); it[1](); });
    ctxmenu.appendChild(mi);
  }
  ctxmenu.style.display = "block";
  const mw = ctxmenu.offsetWidth, mh = ctxmenu.offsetHeight;
  ctxmenu.style.left = Math.min(ev.clientX, window.innerWidth - mw - 4) + "px";
  ctxmenu.style.top = Math.min(ev.clientY, window.innerHeight - mh - 4) + "px";
});

/* ==== page image copy: Cmd/Ctrl + double-click (K-100) ============= */
/* The native viewer's slide-copy gesture, reproduced: Cmd (macOS) /
   Ctrl (Windows) + double-click copies the page as an image through
   the SAME copy-image bridge the context menu uses — clipboard, then
   paste into the note field, so the editor-side path stays shared.
   Plain double-click stays the browser's word selection. */
document.getElementById("scroll").addEventListener("dblclick", (ev) => {
  if (!(ev.metaKey || ev.ctrlKey)) return;
  const hit = pageAndPoint(ev.clientX, ev.clientY);
  if (!hit) return;
  ev.preventDefault();
  const sel = window.getSelection();
  if (sel) { try { sel.removeAllRanges(); } catch (e) {} }
  copyPageImage(hit.page0);
});

/* ==== marquee (Option/Alt+drag copy-as-image) ====================== */
const marqueeEl = document.getElementById("marquee");

/* ---- persisted marquee (K-100): the region survives release ------- */
/* Native semantics mirrored from pdf_viewer.py: the rect is kept after
   the creation drag (like Preview); a plain left press anywhere else
   collapses it; press-and-move INSIDE it drags the region image out;
   a click inside that never becomes a drag clears it on release; the
   context menu re-offers "Copy Selection as Image" while it stands. */
function clearPersistMarquee() {
  state.persistMarquee = null;
  const el = document.getElementById("marqueeKeep");
  if (el && el.parentNode) el.parentNode.removeChild(el);
}

function positionPersistMarquee() {
  const pm = state.persistMarquee;
  if (!pm) return;
  const div = state.pageDivs[pm.page0];
  if (!div) return;
  let el = document.getElementById("marqueeKeep");
  if (!el) {
    el = document.createElement("div");
    el.id = "marqueeKeep";
    el.draggable = true;
    el.title = "Drag into a note field · right-click to copy again";
    el.addEventListener("click", (ev) => {
      ev.stopPropagation();
      clearPersistMarquee();   /* click that never became a drag */
    });
    el.addEventListener("dragstart", (ev) => {
      const cur = state.persistMarquee;
      if (!cur || !cur.dataUrl) { ev.preventDefault(); return; }
      /* Drag-out, webview edition: the page cannot start the native
         QDrag+QMimeData image drag QPdfView uses, so the region
         travels as HTML carrying a data: URI image — what Anki's
         editor webview accepts on drop and inlines through its own
         paste pipeline. Rendered/cached at persist time because
         setData must be synchronous. */
      try {
        ev.dataTransfer.effectAllowed = "copy";
        ev.dataTransfer.setData(
          "text/html", '<img src="' + cur.dataUrl + '">');
      } catch (e) { post("log:marquee dragstart failed: " + e.message); }
    });
  }
  if (el.parentNode !== div) {
    if (el.parentNode) el.parentNode.removeChild(el);
    div.appendChild(el);
  }
  const s = state.scale;
  el.style.left = pm.x * s + "px";
  el.style.top = pm.y * s + "px";
  el.style.width = pm.w * s + "px";
  el.style.height = pm.h * s + "px";
}

function persistMarquee(page0, x, y, w, h) {
  clearPersistMarquee();
  const pm = { page0, x, y, w, h, dataUrl: null };
  state.persistMarquee = pm;
  positionPersistMarquee();
  renderRegionCanvas(page0, x, y, w, h).then((out) => {
    /* Cache the PNG for the synchronous dragstart. Stale results (a
       newer marquee, a dismissal) drop on the floor. */
    if (state.persistMarquee === pm) pm.dataUrl = out.toDataURL("image/png");
  }).catch((e) => post("log:marquee cache failed: " + e.message));
}

document.getElementById("scroll").addEventListener("mousedown", (ev) => {
  if (ev.button !== 0) return;
  if (ev.altKey) {
    /* Alt+press starts a NEW marquee — collapse the persisted one
       first, exactly like the native press handler does. */
    clearPersistMarquee();
    const hit = pageAndPoint(ev.clientX, ev.clientY);
    if (!hit) return;
    ev.preventDefault();
    state.marquee = { page0: hit.page0, x0: ev.clientX, y0: ev.clientY };
    return;
  }
  /* ANY plain left press outside the kept region clears it, like
     Preview collapsing the old selection (native rule). A press ON
     the region is the drag-out arm and must not. */
  if (ev.target && ev.target.id === "marqueeKeep") return;
  clearPersistMarquee();
});
document.addEventListener("mousemove", (ev) => {
  if (!state.marquee) return;
  const m = state.marquee;
  marqueeEl.style.display = "block";
  marqueeEl.style.left = Math.min(m.x0, ev.clientX) + "px";
  marqueeEl.style.top = Math.min(m.y0, ev.clientY) + "px";
  marqueeEl.style.width = Math.abs(ev.clientX - m.x0) + "px";
  marqueeEl.style.height = Math.abs(ev.clientY - m.y0) + "px";
});
document.addEventListener("mouseup", (ev) => {
  if (!state.marquee) return;
  const m = state.marquee;
  state.marquee = null;
  marqueeEl.style.display = "none";
  const div = state.pageDivs[m.page0];
  if (!div) return;
  const pr = div.getBoundingClientRect();
  const s = state.scale;
  const x0 = (Math.min(m.x0, ev.clientX) - pr.left) / s;
  const y0 = (Math.min(m.y0, ev.clientY) - pr.top) / s;
  const w = Math.abs(ev.clientX - m.x0) / s;
  const h = Math.abs(ev.clientY - m.y0) / s;
  if (w > 4 && h > 4) {
    copyRegionImage(m.page0, x0, y0, w, h);
    persistMarquee(m.page0, x0, y0, w, h);  /* kept, like Preview (K-100) */
  }
});

/* ==== zoom engine (K-116) ========================================== */
/* EVERY zoom path — trackpad pinch, \u2318+/\u2212/0, the context menu, the
   annobar buttons — funnels through one session (zoomTo), because the
   old direct path (a synchronous full rezoom per step) tore every
   canvas down and re-rendered from blank: the "zoom renders slowly"
   complaint, live.

   A session gives instant feedback for ~free: the first call captures
   an anchor (the document point to hold still — the cursor for a
   pinch, the viewport centre for stepped zoom) and every call after
   only updates a compositor transform on #pages, origined at that
   anchor. ZOOM_SETTLE_MS after the last input the session settles:
   the transform comes off, softRelayout() resizes the layout and
   CSS-stretches the ALREADY-RENDERED canvases into the new geometry
   (soft, never blank), scroll is corrected so the anchored point
   stays under the pointer exactly, and refreshVisibleFirst()
   re-renders crisp bitmaps — viewport pages first — each swapped in
   only once fully drawn.

   Chromium delivers macOS trackpad pinch to the page as wheel events
   with ctrlKey:true (Ctrl+scroll on a mouse arrives identically).
   Un-handled, QtWebEngine pinch-zooms the whole FRAME — page, sidebar
   and all — fighting the Python-side setZoomFactor(1.0) pin, so every
   ctrl-wheel is preventDefault()ed document-wide and only becomes PDF
   zoom over the page area. */
const PINCH_K = 0.01;          // exp response: factor = e^(-deltaY * k)
const ZOOM_SETTLE_MS = 160;    // quiet time that commits a zoom session
let zoomGen = 0;               // bumped per settle; stale renders discard

/* The scale the user is LOOKING at: the live session target while one
   is open, the committed scale otherwise. Stepped zoom compounds on
   this, so three fast \u2318+ presses mean three steps, not one. */
function sessionTarget() {
  return state.zoom ? state.zoom.baseScale * state.zoom.factor : state.scale;
}

function viewportCenter() {
  const sr = document.getElementById("scroll").getBoundingClientRect();
  return [sr.left + sr.width / 2, sr.top + sr.height / 2];
}

function zoomTo(target, clientX, clientY, fit) {
  if (!state.doc) return;
  const scrollEl = document.getElementById("scroll");
  const pagesEl = document.getElementById("pages");
  if (!state.zoom) {
    const sr = scrollEl.getBoundingClientRect();
    const pr = pagesEl.getBoundingClientRect();   // transform-free here
    state.zoom = {
      baseScale: state.scale,
      factor: 1.0,
      hit: pageAndPoint(clientX, clientY),  // exact settle anchor
      vx: clientX - sr.left, vy: clientY - sr.top,
      cx0: scrollEl.scrollLeft + (clientX - sr.left),
      cy0: scrollEl.scrollTop + (clientY - sr.top),
      scrollLeft0: scrollEl.scrollLeft, scrollTop0: scrollEl.scrollTop,
      originX: clientX - pr.left, originY: clientY - pr.top,
      timer: null, fit: false,
    };
  }
  const p = state.zoom;
  p.fit = !!fit;
  const t = clampScale(target);
  p.factor = t / p.baseScale;
  pagesEl.style.transformOrigin = p.originX + "px " + p.originY + "px";
  pagesEl.style.transform = "scale(" + p.factor + ")";
  updateZoomReadout(t);
  if (p.timer) clearTimeout(p.timer);
  p.timer = setTimeout(zoomSettle, ZOOM_SETTLE_MS);
}

async function zoomSettle() {
  const p = state.zoom;
  if (!p) return;
  state.zoom = null;
  const pagesEl = document.getElementById("pages");
  pagesEl.style.transform = "";
  pagesEl.style.transformOrigin = "";
  if (!state.doc) return;                       // torn down mid-session
  const scrollEl = document.getElementById("scroll");
  // The user (or an overflow clamp) may have scrolled since capture:
  // the anchor's CURRENT viewport offset is the captured one shifted
  // by that delta — correct against where the point is NOW.
  const vx = p.vx - (scrollEl.scrollLeft - p.scrollLeft0);
  const vy = p.vy - (scrollEl.scrollTop - p.scrollTop0);
  const target = clampScale(p.baseScale * p.factor);
  if (Math.abs(target - state.scale) < 0.0005) {
    updateZoomReadout(state.scale);
    return;
  }
  state.userZoomed = !p.fit;
  state.scale = target;
  zoomGen++;
  await softRelayout();
  const div = p.hit ? state.pageDivs[p.hit.page0] : null;
  if (div) {
    // The anchored PDF point, in the NEW layout, back under the anchor.
    scrollEl.scrollLeft = div.offsetLeft + p.hit.xPt * state.scale - vx;
    scrollEl.scrollTop = div.offsetTop + p.hit.yPt * state.scale - vy;
  } else {
    // Anchor was over a gap: proportional correction is close enough.
    const r = target / p.baseScale;
    scrollEl.scrollLeft = p.cx0 * r - vx;
    scrollEl.scrollTop = p.cy0 * r - vy;
  }
  refreshVisibleFirst();
}

/* Resize the layout to state.scale WITHOUT dropping a pixel:
   placeholders just resize; rendered pages keep their old canvas,
   CSS-stretched into the new geometry (soft until refreshed), the
   text layer resized with it (spans track --scale-factor), and the
   annotation layers redrawn (cheap DOM). relayout() stays the
   teardown twin for panel RESIZES; zoom must never blank. */
async function softRelayout() {
  applyScaleFactor();
  const first = await state.doc.getPage(1);
  const base = first.getViewport({ scale: 1.0 });
  for (const d of state.pageDivs) {
    const num = parseInt(d.dataset.page, 10);
    const w = Math.floor(base.width * state.scale);
    const h = Math.floor(base.height * state.scale);
    d.style.width = w + "px";
    d.style.height = h + "px";
    const r = state.rendered.get(num);
    if (r && r.canvas) {
      r.canvas.style.width = w + "px";
      r.canvas.style.height = h + "px";
      if (r.textLayer) {
        r.textLayer.style.width = w + "px";
        r.textLayer.style.height = h + "px";
      }
      renderAnnotLayers(num, d);
    }
  }
  /* The marquee's page may be outside the rendered set — its div was
     just resized above regardless, so re-land the overlay (K-100).
     The text editor rides the same unconditional pass (K-150): this
     is the zoom settle, and the box has to land at the new scale
     whether or not its page happened to be rendered. */
  positionPersistMarquee();
  positionTextEdit();
}

/* Crisp replacement render for one already-rendered page, swapped in
   ONLY when fully drawn — the stretched old canvas keeps showing
   meanwhile (never blank-then-redraw). Superseded work (a newer
   settle, a scroll-away teardown) discards itself. */
async function refreshPage(num, div) {
  const gen = zoomGen;
  const entry = state.rendered.get(num);
  if (!entry || !entry.canvas || entry.refreshing || !div) return;
  entry.refreshing = true;
  let textLayer = null;
  try {
    const page = await state.doc.getPage(num);
    const viewport = page.getViewport({ scale: state.scale });
    const canvas = document.createElement("canvas");
    canvas.className = "pg";
    const ratio = window.devicePixelRatio || 1;
    canvas.width = Math.floor(viewport.width * ratio);
    canvas.height = Math.floor(viewport.height * ratio);
    canvas.style.width = Math.floor(viewport.width) + "px";
    canvas.style.height = Math.floor(viewport.height) + "px";
    await page.render({
      canvasContext: canvas.getContext("2d"), viewport: viewport,
      transform: ratio !== 1 ? [ratio, 0, 0, ratio, 0, 0] : null,
      annotationMode: pdfjsLib.AnnotationMode.DISABLE,
    }).promise;
    // The replacement text layer renders attached-but-hidden: pdf.js
    // measures spans against computed style, and a detached node has
    // none (renderPage's documented rule).
    textLayer = document.createElement("div");
    textLayer.className = "textLayer";
    textLayer.style.width = Math.floor(viewport.width) + "px";
    textLayer.style.height = Math.floor(viewport.height) + "px";
    textLayer.style.visibility = "hidden";
    div.appendChild(textLayer);
    const textContent = await page.getTextContent();
    const task = pdfjsLib.renderTextLayer({
      textContentSource: textContent,
      container: textLayer,
      viewport: viewport,
    });
    if (task && task.promise) { try { await task.promise; } catch (e) {} }
    if (gen !== zoomGen || state.rendered.get(num) !== entry
        || !div.isConnected) {
      try { div.removeChild(textLayer); } catch (e) {}
      return;   // superseded — a newer settle or a teardown owns it now
    }
    div.style.width = Math.floor(viewport.width) + "px";
    div.style.height = Math.floor(viewport.height) + "px";
    try { div.replaceChild(canvas, entry.canvas); }
    catch (e) { div.appendChild(canvas); }
    if (entry.textLayer) {
      try { div.removeChild(entry.textLayer); } catch (e) {}
    }
    textLayer.style.visibility = "";
    const spans = Array.from(textLayer.querySelectorAll("span"));
    state.rendered.set(num, { canvas, textLayer, spans });
    renderAnnotLayers(num, div);
    if (state.find.matches.length) highlightCurrentMatchIfVisible();
  } catch (e) {
    if (textLayer) { try { div.removeChild(textLayer); } catch (e2) {} }
    post("log:refresh " + num + " failed: " + e.message);
  } finally {
    entry.refreshing = false;
  }
}

function refreshVisibleFirst() {
  const scrollEl = document.getElementById("scroll");
  const top = scrollEl.scrollTop, bot = top + scrollEl.clientHeight;
  const visible = [], rest = [];
  for (const num of state.rendered.keys()) {
    const d = state.pageDivs[num - 1];
    if (!d) continue;
    const inView = d.offsetTop < bot && d.offsetTop + d.offsetHeight > top;
    (inView ? visible : rest).push(num);
  }
  visible.sort((a, b) => a - b);
  (async () => {
    for (const n of visible) await refreshPage(n, state.pageDivs[n - 1]);
    for (const n of rest) await refreshPage(n, state.pageDivs[n - 1]);
  })();
}

document.addEventListener("wheel", (ev) => {
  if (!ev.ctrlKey) return;    // plain two-finger scroll stays untouched
  ev.preventDefault();        // the frame never zooms, anywhere on it
  if (!state.doc) return;
  if (!document.getElementById("scroll").contains(ev.target)) return;
  zoomTo(sessionTarget() * Math.exp(-ev.deltaY * PINCH_K),
         ev.clientX, ev.clientY, false);
}, { passive: false });

/* WebKit-lineage gesture events: if the engine ever synthesizes them,
   cancelling keeps a second zoom path from double-firing. */
for (const g of ["gesturestart", "gesturechange", "gestureend"]) {
  document.addEventListener(g, (ev) => ev.preventDefault());
}

/* ==== annotation toolbar (K-116) =================================== */
/* Highlight and Add Text lived only in the context menu — invisible
   until right-clicked (the live complaint). The annobar is their
   always-visible twin; the menu items stay.

   Same selection rule as the context menu (documented there): a
   trusted mousedown over non-editable UI collapses the selection
   BEFORE click fires, so the bar cancels mousedown — clicking
   Highlight can then consume the selection it was aimed at, and the
   buttons never steal focus from the page. */
document.getElementById("annobar").addEventListener(
  "mousedown", (ev) => ev.preventDefault());

function setTool(tool) {
  state.tool = state.tool === tool ? null : tool;
  for (const [id, name] of [["abHl", "hl"], ["abText", "text"]]) {
    const b = document.getElementById(id);
    b.classList.toggle("active", state.tool === name);
    b.setAttribute("aria-pressed", String(state.tool === name));
  }
  document.getElementById("scroll").classList.toggle(
    "textTool", state.tool === "text");
  syncAnnobarMode();   /* K-150: the ink row follows the armed tool */
}

document.getElementById("abHl").addEventListener("click", () => {
  const arming = state.tool !== "hl";
  setTool("hl");
  // Preview's move: arming with a live selection highlights it now.
  // The tool STAYS armed afterwards (K-159) — see the mouseup handler
  // for why that is safe. Clicking this button again disarms, because
  // setTool toggles.
  if (arming && selectionRectMap()) addHighlightFromSelection();
});
document.getElementById("abText").addEventListener(
  "click", () => setTool("text"));

/* Ink swatches: pick the colour the next highlight is minted in. The
   pressed swatch is the only "selected" cue — the fills stay at full
   strength because each one IS its ink. Like arming Highlight, picking
   a colour with a live selection highlights it immediately (the bar
   cancels mousedown above, so that selection is still there). These
   live INSIDE #annobar precisely so they inherit that cancel. */
for (const sw of document.querySelectorAll("#abInks .inkSw")) {
  sw.addEventListener("click", () => {
    if (textMode()) {
      /* Same row, text values (K-150). Picking while a box is open
         recolours it live and the caret never moves — that is exactly
         what the bar's mousedown cancel above buys. */
      if (!sw.dataset.tink) return;
      state.tink = sw.dataset.tink;
      const te = state.textEdit;
      if (te) {
        te.color = tinkHex(state.tink) || te.color;
        te.body.style.color = te.color;
      }
      syncAnnobarMode();
      return;
    }
    if (!sw.dataset.ink) return;   /* black is text-only */
    state.ink = sw.dataset.ink;
    syncAnnobarMode();
    if (selectionRectMap()) addHighlightFromSelection();
  });
}
document.getElementById("abZoomOut").addEventListener(
  "click", () => window.klausSetZoom(1 / 1.2));
document.getElementById("abZoomIn").addEventListener(
  "click", () => window.klausSetZoom(1.2));
document.getElementById("abZoomFit").addEventListener(
  "click", () => window.klausZoomReset());

/* Highlight tool: releasing a selection highlights it immediately, and
   the tool STAYS ARMED for the next drag (K-159: "I want to stay in
   that mode"). Only the Highlight button and Escape disarm.

   K-149 made this one-shot as "cause 2" of the double-highlight bug,
   so reversing it needs a reason, and the reason is that the one-shot
   was never the load-bearing half. The real cause was
   Range.getClientRects() returning a fully covered span's border box
   AND its text quad, so ONE drag minted two coincident rects that
   composited at the 43% paint alpha. merge_rects fixed that at mint
   time, and merge_highlight_records makes a SECOND drag over the same
   text idempotent as well: same-ink rects an existing record already
   covers are dropped, the rest union into the record they touch, and
   a mint that changes nothing never even reaches the JSON
   (_bridge_hl_add returns early on `merged == self._highlights`).
   Pinned by re-minting the same drag three times in
   tests/test_pdfjs_viewer.py.

   selectionRectMap() gates the call — a bare click while armed must
   never fire the "select text first" toast — and
   addHighlightFromSelection collapses the selection, so a stray
   mouseup afterwards has nothing to re-mint. The 0-timeout lets Blink
   finalize the selection after mouseup. */
document.addEventListener("mouseup", () => {
  if (state.tool !== "hl") return;
  setTimeout(() => {
    if (state.tool === "hl" && selectionRectMap()) {
      addHighlightFromSelection();
    }
  }, 0);
});

/* Text tool: the click opens an editor box ON the page at that point,
   and the tool STAYS ARMED (K-159) so the next click places the next
   box — clicking away from an open box commits it (blur) and the same
   click starts the next one. Only the Add Text button and Escape
   disarm. Nothing is posted here (K-150): the record is minted from
   text that does not exist yet, so the bridge call happens at COMMIT.

   Clicks that land INSIDE the open editor are swallowed by the box
   itself (openTextEdit's click listener) — without that, a sticky
   tool would treat every caret placement inside your own box as a
   request to commit it and open another one on top. */
document.getElementById("scroll").addEventListener("click", (ev) => {
  if (state.tool !== "text" || ev.button !== 0) return;
  const hit = pageAndPoint(ev.clientX, ev.clientY);
  if (!hit) return;
  ev.preventDefault();
  ev.stopPropagation();
  /* A click ON an existing box re-edits it instead of dropping an
     empty one over it. The double-click editor below is unreachable
     while the tool is armed (this handler opens a box on the first of
     the two clicks, and its `state.textEdit` gate then returns), so a
     sticky tool has to do that job itself — which is Preview's rule
     anyway. */
  const rec = textRecordAt(hit.page0, hit.xPt, hit.yPt);
  if (rec) {
    openTextEdit(rec.page | 0, rec.rects[0][0], rec.rects[0][1], rec);
    return;
  }
  openTextEdit(hit.page0, hit.xPt, hit.yPt, null);
});

/* ==== in-place text editor (K-150) ================================= */
/* "The text adding system is so ugly … make it look the way Preview
   has it on macOS" — it used to be a modal QInputDialog over a PDF you
   could no longer see. Preview instead puts the box on the page: click,
   type where you clicked, drag it by its frame, pick colour and size
   from the toolbar, click away to commit.

   WHAT MAKES THIS HARD is that renderAnnotLayers DESTROYS .hlLayer and
   .noteLayer and rebuilds them from scratch, from four call sites —
   renderPage, klausSetAnnotations, the zoom settle's softRelayout, and
   refreshPage's crisp swap — plus teardownPage when a page leaves the
   observer window. A contenteditable living in .hlLayer is obliterated
   mid-keystroke by any of them, and worst of all by the push that
   follows its OWN save. So the editor is a DIRECT CHILD OF .page that
   renderAnnotLayers does not own, re-landed (never rebuilt) on every
   overlay pass — exactly the contract positionPersistMarquee has kept
   for the persisted marquee since K-100. Nothing removes it, so the
   caret and the selection survive zoom, scroll and pushes.

   The other rule is that its LAYOUT is in page points and only its
   transform is scaled. Sizing it in px = pt * scale would re-wrap the
   text on every zoom step and jitter on the fractional ones; this way
   the wrap points are the same at 25% and at 400%, and they are the
   ones that get committed. */
const TEXT_SIZES = [8, 10, 12, 14, 18, 24, 36, 48];
const MAX_TEXT_CHARS = 4000;

/* Mirror of pdfjs_viewer.sanitize_text — same normalization, so the
   text this box MEASURES itself against is the text Python stores.
   Python re-runs its own copy on arrival; JS is never trusted. */
function sanitizeEditText(value) {
  return String(value == null ? "" : value)
    .replace(/\r\n/g, "\n").replace(/\r/g, "\n").replace(/\t/g, " ")
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, "")
    .slice(0, MAX_TEXT_CHARS).trim();
}

/* Mirror of pdfjs_viewer.text_box_size (mergeRects' arrangement: two
   implementations, pinned against each other). The editor has to size
   itself to the box that will be committed, or the text jumps and
   re-wraps the moment the static .hltext twin takes over. */
function textBoxSize(text, size, rows) {
  const lines = String(text || "").split("\n");
  let longest = 0;
  for (const line of lines) longest = Math.max(longest, line.length);
  const w = Math.min(Math.max(longest * size * 0.6 + 8, 60), 480);
  const perRow = Math.max(w - 8, size * 0.6);
  let wrapped = 0;
  for (const line of lines) {
    wrapped += Math.max(1, Math.ceil(line.length * size * 0.6 / perRow));
  }
  wrapped = Math.max(wrapped, rows || 0);
  return [w, Math.min(Math.max(wrapped * size * 1.35 + 6, size * 1.5), 720)];
}

/* currentInk()'s sibling for the text row: the swatch's own theme
   custom property, so the colour seen is the colour recorded and this
   file still spells no hex. Kept separate rather than folded into one
   helper because the two prefixes name genuinely different palettes —
   a highlight is read THROUGH at 43% alpha, text is read AS glyphs. */
function tinkHex(name) {
  try {
    const v = getComputedStyle(document.documentElement)
      .getPropertyValue("--tink-" + name).trim();
    return v || null;
  } catch (e) { return null; }
}

function currentTextInk() { return tinkHex(state.tink); }

function tinkNameFor(hex) {
  const want = String(hex || "").trim().toLowerCase();
  if (!want) return null;
  for (const sw of document.querySelectorAll("#abInks .inkSw")) {
    const name = sw.dataset.tink;
    if (name && String(tinkHex(name) || "").toLowerCase() === want) {
      return name;
    }
  }
  return null;   // an adopted box in some colour the row does not offer
}

/* The annobar is in text mode while the tool is armed OR a box is
   open: the swatch row repaints to the text inks, a black swatch
   joins it, and the size stepper appears. */
function textMode() {
  return state.tool === "text" || state.textEdit !== null;
}

function syncAnnobarMode() {
  const on = textMode();
  const te = state.textEdit;
  document.getElementById("annobar").classList.toggle("textMode", on);
  document.getElementById("abInks").classList.toggle("textMode", on);
  const selected = on
    ? (te ? tinkNameFor(te.color) : state.tink)
    : state.ink;
  for (const sw of document.querySelectorAll("#abInks .inkSw")) {
    const name = on ? sw.dataset.tink : sw.dataset.ink;
    const active = !!name && name === selected;
    sw.classList.toggle("active", active);
    sw.setAttribute("aria-pressed", String(active));
  }
  document.getElementById("abTszVal").textContent =
    String(te ? te.size : state.tsize);
}

function textRecordAt(page0, xPt, yPt) {
  for (let i = state.annots.length - 1; i >= 0; i--) {
    const rec = state.annots[i];
    if ((rec.page | 0) !== page0 || rec.kind !== "text") continue;
    const r = (rec.rects || [])[0];
    if (!r) continue;
    if (r[0] <= xPt && xPt <= r[0] + r[2] &&
        r[1] <= yPt && yPt <= r[1] + r[3]) return rec;
  }
  return null;
}

/* Open the editor at (xPt, yPt) page points. rec === null places a NEW
   box; passing a record re-edits it in place (its static twin is
   skipped in renderAnnotLayers meanwhile, so nothing ghosts under the
   live one). Committing an already-open box first means the "one at a
   time" rule needs no singleton bookkeeping. */
function openTextEdit(page0, xPt, yPt, rec) {
  if (state.textEdit) commitTextEdit();
  const div = state.pageDivs[page0];
  if (!div) return;
  const el = document.createElement("div");
  el.id = "textEdit";
  el.className = "editLayer";
  const grip = document.createElement("div");
  grip.className = "editGrip";
  grip.title = "Drag to move";
  const body = document.createElement("div");
  body.className = "editBody";
  try { body.contentEditable = "plaintext-only"; } catch (e) {}
  if (!body.isContentEditable) body.contentEditable = "true";
  body.spellcheck = false;
  body.textContent = rec ? String(rec.text || "") : "";
  el.appendChild(grip);
  el.appendChild(body);
  const color = (rec && rec.color)
    ? String(rec.color) : (currentTextInk() || "");
  const size = rec ? (parseFloat(rec.size) || state.tsize) : state.tsize;
  body.style.color = color;
  body.style.fontSize = size + "px";   // POINTS — scale() carries it
  state.textEdit = {
    id: rec ? String(rec.id || "") : null,
    page0: page0, x: xPt, y: yPt, color: color, size: size,
    el: el, body: body,
  };
  /* Swallow mousedown so the press belongs to the caret: #scroll's
     handler would otherwise collapse a persisted marquee, and an
     Alt-press would preventDefault into a rubber band. CLICK is
     swallowed for a different reason (K-159): the text tool stays
     armed now, and #scroll's placement handler would read a click
     inside this box as "place another box here" — committing what is
     being typed and reopening an empty one on top of it. Both are
     needed; stopping mousedown does not stop the click that follows. */
  el.addEventListener("mousedown", (ev) => ev.stopPropagation());
  el.addEventListener("click", (ev) => ev.stopPropagation());
  grip.addEventListener("mousedown", startTextDrag);
  body.addEventListener("input", sizeTextEdit);
  body.addEventListener("blur", () => {
    if (state.textEdit && state.textEdit.body === body) commitTextEdit();
  });
  body.addEventListener("keydown", (ev) => {
    /* Escape commits, like clicking away — Preview keeps what you
       typed. stopPropagation so the document handler does not also
       clear a tool or the find bar out from under it: with the tool
       sticky (K-159) that makes Escape a two-step — the first commits
       the box, the second disarms Add Text. Enter is a newline; the
       mod chord is the keyboard's "click away". */
    if (ev.key === "Escape"
        || ((ev.metaKey || ev.ctrlKey) && ev.key === "Enter")) {
      ev.preventDefault();
      ev.stopPropagation();
      commitTextEdit();
    }
  });
  div.appendChild(el);
  sizeTextEdit();
  positionTextEdit();
  repaintAnnotPage(page0);   /* drop the static twin, if this edits one */
  syncAnnobarMode();
  try {
    body.focus();
    const range = document.createRange();
    range.selectNodeContents(body);
    range.collapse(false);              // caret at the end, like Preview
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  } catch (e) { post("log:text editor focus failed: " + e.message); }
}

/* Repaint ONE page's annotation layers so renderAnnotLayers' hltext
   skip takes effect NOW. Opening the editor on an existing record
   does not otherwise re-run that function, and its static twin went
   on sitting under the live box, a glyph offset apart — caught in an
   offscreen render, invisible to every source pin. Closing is the
   mirror: the twin has to come back, and on the paths where no push
   will bring it back this is what does. */
function repaintAnnotPage(page0) {
  const div = state.pageDivs[page0];
  const r = state.rendered.get(page0 + 1);
  if (div && r && r.canvas) renderAnnotLayers(page0 + 1, div);
}

function sizeTextEdit() {
  const te = state.textEdit;
  if (!te) return;
  /* RAW text, not the sanitized form: a trailing newline you have just
     typed must grow the box, not shrink it back a line. */
  const box = textBoxSize(te.body.innerText || "", te.size, 0);
  te.el.style.width = box[0] + "px";
  te.el.style.minHeight = box[1] + "px";
}

/* positionPersistMarquee's contract, for the editor: page-point
   geometry re-landed at the CURRENT scale, on every overlay pass and
   every zoom settle. The element itself is never rebuilt — that is the
   whole reason the caret survives. */
function positionTextEdit() {
  const te = state.textEdit;
  if (!te || !te.el) return;
  const div = state.pageDivs[te.page0];
  if (!div) return;
  if (te.el.parentNode !== div) div.appendChild(te.el);
  const s = state.scale;
  te.el.style.left = te.x * s + "px";
  te.el.style.top = te.y * s + "px";
  te.el.style.transform = "scale(" + s + ")";
}

/* repaint === false only when a bridge call is already on its way for
   this record: the canonical push that answers it repaints anyway, and
   repainting HERE would flash the pre-edit text for one round trip.
   Everywhere else it restores the twin immediately. */
function closeTextEdit(repaint) {
  const te = state.textEdit;
  state.textEdit = null;
  state.textDrag = null;
  if (te && te.el && te.el.parentNode) {
    try { te.el.parentNode.removeChild(te.el); } catch (e) {}
  }
  if (te && repaint !== false) repaintAnnotPage(te.page0);
  syncAnnobarMode();
}

/* Commit: the ONLY place a text record crosses the bridge. Closing
   first means the canonical records that come back are rendered by
   renderAnnotLayers with nothing to skip. An empty new box mints
   nothing; emptying an EXISTING one deletes it through hl-remove,
   which already tombstones an adopted record (K-081) — that path is
   not worth forking into the update handler. */
function commitTextEdit() {
  const te = state.textEdit;
  if (!te) return;
  const text = sanitizeEditText(te.body.innerText || "");
  let rows = 0;
  try {
    rows = Math.max(1, Math.round(te.body.scrollHeight / (te.size * 1.15)));
  } catch (e) { rows = 0; }
  closeTextEdit(!te.id);   /* an existing record: let the push repaint */
  if (!te.id) {
    if (!text) return;
    postB64("text-add", {
      page: te.page0, x: te.x, y: te.y,
      text: text, color: te.color, size: te.size, rows: rows,
    });
    return;
  }
  if (!text) { postB64("hl-remove", { id: te.id }); return; }
  postB64("text-update", {
    id: te.id, x: te.x, y: te.y,
    text: text, color: te.color, size: te.size, rows: rows,
  });
}

/* Drag by the grip only: the interior is a text field, so a press
   there places the caret (Preview moves an annotation by its frame
   too). preventDefault keeps focus — and therefore the caret and the
   un-committed text — exactly where it was. */
function startTextDrag(ev) {
  const te = state.textEdit;
  if (!te || ev.button !== 0) return;
  ev.preventDefault();
  ev.stopPropagation();
  state.textDrag = { x0: ev.clientX, y0: ev.clientY, ax: te.x, ay: te.y };
}

document.addEventListener("mousemove", (ev) => {
  const d = state.textDrag, te = state.textEdit;
  if (!d || !te) return;
  const s = state.scale || 1;
  const div = state.pageDivs[te.page0];
  const maxX = div ? Math.max(0, div.offsetWidth / s - 8) : 0;
  const maxY = div ? Math.max(0, div.offsetHeight / s - 8) : 0;
  te.x = Math.min(Math.max(d.ax + (ev.clientX - d.x0) / s, 0), maxX);
  te.y = Math.min(Math.max(d.ay + (ev.clientY - d.y0) / s, 0), maxY);
  positionTextEdit();
});
document.addEventListener("mouseup", () => { state.textDrag = null; });

/* Double-click an existing text box to edit it in place. Registered
   AFTER the Cmd/Ctrl slide-copy handler and gated on the absence of
   that modifier, so the two double-click gestures never overlap. */
document.getElementById("scroll").addEventListener("dblclick", (ev) => {
  if (ev.metaKey || ev.ctrlKey || state.textEdit) return;
  const hit = pageAndPoint(ev.clientX, ev.clientY);
  if (!hit) return;
  const rec = textRecordAt(hit.page0, hit.xPt, hit.yPt);
  if (!rec) return;
  ev.preventDefault();
  const sel = window.getSelection();
  if (sel) { try { sel.removeAllRanges(); } catch (e) {} }
  openTextEdit(rec.page | 0, rec.rects[0][0], rec.rects[0][1], rec);
});

function stepTextSize(dir) {
  const cur = state.textEdit ? state.textEdit.size : state.tsize;
  let idx = 0;
  for (let i = 0; i < TEXT_SIZES.length; i++) {
    if (TEXT_SIZES[i] <= cur) idx = i;
  }
  const size = TEXT_SIZES[
    Math.min(Math.max(idx + dir, 0), TEXT_SIZES.length - 1)];
  state.tsize = size;
  const te = state.textEdit;
  if (te) {
    te.size = size;
    te.body.style.fontSize = size + "px";
    sizeTextEdit();
  }
  syncAnnobarMode();
}
document.getElementById("abTszDown").addEventListener(
  "click", () => stepTextSize(-1));
document.getElementById("abTszUp").addEventListener(
  "click", () => stepTextSize(1));

/* ==== find ========================================================= */
async function ensurePageTexts() {
  if (state.pageTexts) return state.pageTexts;
  const out = [];
  for (let i = 1; i <= state.doc.numPages; i++) {
    const page = await state.doc.getPage(i);
    const tc = await page.getTextContent();
    let str = "";
    const items = [];
    for (const it of tc.items) {
      items.push({ start: str.length, len: it.str.length });
      str += it.str;
      if (it.hasEOL) str += "\n";
    }
    out.push({ str, items });
  }
  state.pageTexts = out;
  return out;
}

function showFindBar() {
  document.getElementById("findbar").classList.add("visible");
  const inp = document.getElementById("findinput");
  inp.focus(); inp.select();
}
function hideFindBar() {
  document.getElementById("findbar").classList.remove("visible");
  clearFindHighlight();
  state.find = { query: "", matches: [], index: -1 };
  document.getElementById("findcount").textContent = "";
}

let findTimer = null;
document.getElementById("findinput").addEventListener("input", () => {
  if (findTimer) clearTimeout(findTimer);
  findTimer = setTimeout(runFind, 250);
});
document.getElementById("findnext").addEventListener("click", () => stepFind(1));
document.getElementById("findprev").addEventListener("click", () => stepFind(-1));
document.getElementById("findclose").addEventListener("click", hideFindBar);
document.getElementById("findinput").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") { ev.preventDefault(); stepFind(ev.shiftKey ? -1 : 1); }
  else if (ev.key === "Escape") { ev.preventDefault(); hideFindBar(); }
});

async function runFind() {
  const q = document.getElementById("findinput").value.trim().toLowerCase();
  clearFindHighlight();
  state.find = { query: q, matches: [], index: -1 };
  const countEl = document.getElementById("findcount");
  if (!q || !state.doc) { countEl.textContent = ""; return; }
  const texts = await ensurePageTexts();
  const matches = [];
  for (let p = 0; p < texts.length; p++) {
    const hay = texts[p].str.toLowerCase();
    let at = hay.indexOf(q);
    while (at !== -1) {
      // owning text item = the one whose range contains the match start
      let itemIdx = 0;
      const items = texts[p].items;
      for (let k = 0; k < items.length; k++) {
        if (items[k].start <= at && at < items[k].start + Math.max(1, items[k].len)) {
          itemIdx = k; break;
        }
        if (items[k].start > at) break;
        itemIdx = k;
      }
      /* start/len (page-string coords) drive the exact-substring paint
         (K-100); itemIdx stays the scroll anchor + ring fallback. */
      matches.push({ page0: p, itemIdx, start: at, len: q.length });
      at = hay.indexOf(q, at + Math.max(1, q.length));
    }
  }
  state.find.matches = matches;
  countEl.textContent = matches.length ? `1 / ${matches.length}` : "0 matches";
  if (matches.length) { state.find.index = 0; jumpToMatch(); }
}

function stepFind(dir) {
  const f = state.find;
  if (!f.matches.length) return;
  f.index = (f.index + dir + f.matches.length) % f.matches.length;
  document.getElementById("findcount").textContent =
      `${f.index + 1} / ${f.matches.length}`;
  jumpToMatch();
}

function clearFindHighlight() {
  try {
    if (typeof CSS !== "undefined" && CSS.highlights) {
      CSS.highlights.delete("klaus-find");
    }
  } catch (e) {}
  for (const el of document.querySelectorAll(".findCurrent")) {
    el.classList.remove("findCurrent");
  }
}

/* The per-span slices covering one match (K-100). A page's find string
   is the concatenation of its text items (plus "\n" joiners that live
   in NO item), and items map 1:1 onto the rendered text-layer spans —
   so a match crossing item boundaries becomes one [a,b) slice per
   owning span, each in that span's own character coordinates. */
function matchSegments(m) {
  const texts = state.pageTexts;
  if (!texts || !texts[m.page0]) return [];
  const items = texts[m.page0].items;
  const end = m.start + m.len;
  const segs = [];
  for (let k = 0; k < items.length; k++) {
    const it = items[k];
    if (it.start >= end) break;
    const a = Math.max(m.start, it.start);
    const b = Math.min(end, it.start + it.len);
    if (b > a) segs.push({ itemIdx: k, a: a - it.start, b: b - it.start });
  }
  return segs;
}

async function jumpToMatch() {
  const m = state.find.matches[state.find.index];
  if (!m) return;
  const div = state.pageDivs[m.page0];
  if (!div) return;
  const r = state.rendered.get(m.page0 + 1);
  if (!r || !r.spans) {
    div.scrollIntoView({ block: "center" });
    await renderPage(m.page0 + 1, div);
  }
  highlightCurrentMatchIfVisible(true);
}

function highlightCurrentMatchIfVisible(scrollTo) {
  clearFindHighlight();
  const m = state.find.matches[state.find.index];
  if (!m) return;
  const r = state.rendered.get(m.page0 + 1);
  if (!r || !r.spans || !r.spans.length) return;
  const anchor = r.spans[Math.min(m.itemIdx, r.spans.length - 1)];
  if (!anchor) return;
  /* Exact-substring paint (K-100) via the CSS Custom Highlight API —
     Range objects over the text-layer spans' text nodes, so nothing
     mutates pdf.js's DOM (a <mark> wrap would shift its measured span
     widths). Guarded: no API, or empty ranges (an old match shape, a
     span without a text node) fall back to ringing the owning span. */
  let painted = false;
  try {
    if (typeof Highlight !== "undefined"
        && typeof CSS !== "undefined" && CSS.highlights
        && m.len && state.pageTexts) {
      const ranges = [];
      for (const seg of matchSegments(m)) {
        const span = r.spans[seg.itemIdx];
        const node = span && span.firstChild;
        if (!node || node.nodeType !== Node.TEXT_NODE) continue;
        const max = node.data.length;
        const a = Math.min(seg.a, max), b = Math.min(seg.b, max);
        if (b <= a) continue;
        const range = document.createRange();
        range.setStart(node, a);
        range.setEnd(node, b);
        ranges.push(range);
      }
      if (ranges.length) {
        CSS.highlights.set("klaus-find", new Highlight(...ranges));
        painted = true;
      }
    }
  } catch (e) { post("log:find highlight failed: " + e.message); }
  if (!painted) anchor.classList.add("findCurrent");
  if (scrollTo) anchor.scrollIntoView({ block: "center" });
}

/* ==== thumbnails =================================================== */
function buildThumbs() {
  const el = document.getElementById("thumbs");
  el.textContent = "";
  if (!state.doc) return;
  if (state.thumbObserver) state.thumbObserver.disconnect();
  state.thumbObserver = new IntersectionObserver((entries) => {
    for (const en of entries) {
      if (en.isIntersecting) renderThumb(parseInt(en.target.dataset.page, 10));
    }
  }, { root: el, rootMargin: "100% 0px" });
  for (let i = 1; i <= state.doc.numPages; i++) {
    const t = document.createElement("div");
    t.className = "thumb";
    t.dataset.page = String(i);
    const num = document.createElement("div");
    num.className = "tnum";
    num.textContent = String(i);
    t.appendChild(num);
    t.addEventListener("click", () => window.klausGoToPage(i));
    el.appendChild(t);
    state.thumbObserver.observe(t);
  }
  markCurrentThumb(state.currentPage || 1);
}

async function renderThumb(num) {
  const t = document.querySelector(`.thumb[data-page="${num}"]`);
  if (!t || t.querySelector("canvas") || !state.doc) return;
  try {
    const page = await state.doc.getPage(num);
    const base = page.getViewport({ scale: 1.0 });
    const scale = 140 / base.width;
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement("canvas");
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport, annotationMode: pdfjsLib.AnnotationMode.DISABLE }).promise;
    t.insertBefore(canvas, t.firstChild);
  } catch (e) { post("log:thumb " + num + " failed: " + e.message); }
}

function markCurrentThumb(page) {
  for (const el of document.querySelectorAll(".thumb.current")) {
    el.classList.remove("current");
  }
  const t = document.querySelector(`.thumb[data-page="${page}"]`);
  if (t) t.classList.add("current");
}

window.klausToggleThumbs = function () {
  const el = document.getElementById("thumbs");
  el.classList.toggle("visible");
  if (el.classList.contains("visible")) markCurrentThumb(state.currentPage || 1);
};

/* ==== keyboard ===================================================== */
document.addEventListener("keydown", (ev) => {
  const mod = ev.metaKey || ev.ctrlKey;
  if (mod && !ev.shiftKey && !ev.altKey && ev.key.toLowerCase() === "f") {
    ev.preventDefault(); showFindBar();
  } else if (mod && ev.shiftKey && ["h", "a"].includes(ev.key.toLowerCase())) {
    ev.preventDefault(); addHighlightFromSelection();
  } else if (mod && ev.altKey && ev.key.toLowerCase() === "g") {
    ev.preventDefault(); post("goto-request");
  } else if (mod && !ev.shiftKey && ev.key.toLowerCase() === "g") {
    ev.preventDefault(); stepFind(1);
  } else if (mod && ev.shiftKey && ev.key.toLowerCase() === "g") {
    ev.preventDefault(); stepFind(-1);
  } else if (mod && (ev.key === "=" || ev.key === "+")) {
    ev.preventDefault(); window.klausSetZoom(1.2);
  } else if (mod && ev.key === "-") {
    ev.preventDefault(); window.klausSetZoom(1 / 1.2);
  } else if (mod && ev.key === "0") {
    ev.preventDefault(); window.klausZoomReset();
  } else if (ev.key === "Escape") {
    hideMenu();
    if (state.tool) setTool(null);
    if (document.getElementById("findbar").classList.contains("visible")) {
      hideFindBar();
    }
  }
});

/* ==== API called from Python ======================================= */
window.klausGoToPage = function (num) {
  const d = state.pageDivs[num - 1];
  if (d) d.scrollIntoView({ block: "start" });
};

window.klausSetZoom = function (factor) {
  if (!state.doc) return;
  // Through the zoom session: instant transform feedback, one settled
  // re-render behind rapid steps, anchored at the viewport centre.
  // userZoomed is committed by the settle.
  const c = viewportCenter();
  zoomTo(sessionTarget() * factor, c[0], c[1], false);
};

window.klausZoomReset = async function () {
  if (!state.doc) return;
  const first = await state.doc.getPage(1);
  const base = first.getViewport({ scale: 1.0 });
  const fit = clampScale(
    (document.getElementById("scroll").clientWidth - 24) / base.width
  );
  const c = viewportCenter();
  zoomTo(fit, c[0], c[1], true);   // fit: settle clears userZoomed
};

async function rezoom(keepPage) {
  await relayout();
  window.klausGoToPage(keepPage);
}

/* Teardown re-layout at state.scale, scroll untouched — the width
   REFIT path (ResizeObserver -> rezoom). Zoom never comes here: its
   settle rides softRelayout + refreshPage so pages are never blanked. */
async function relayout() {
  applyScaleFactor();
  const first = await state.doc.getPage(1);
  const base = first.getViewport({ scale: 1.0 });
  for (const d of state.pageDivs) {
    teardownPage(parseInt(d.dataset.page, 10), d);
    d.style.width = Math.floor(base.width * state.scale) + "px";
    d.style.height = Math.floor(base.height * state.scale) + "px";
  }
  state.rendered.clear();
  /* teardownPage never touches the editor (it is not one of the four
     layers it removes), so a panel resize mid-sentence leaves the box
     alive — at the OLD scale until this lands it again (K-150). */
  positionTextEdit();
}

window.klausScrollTo = function (y) {
  document.getElementById("scroll").scrollTop = y;
};

window.klausScrollPosition = function () {
  return document.getElementById("scroll").scrollTop;
};

/* Transcript strip (Plan 2 D6, K-258; repositioned, fix round 1 C1):
   what was said over the CURRENT page (pageIndex, 0-based, kept only
   for signature parity with the bridge call — this ONE static
   #klausTranscript element, a sibling of #pages set up in the markup
   above, is never keyed per page in the DOM; Python is the source of
   truth for which page's text this is, via _refresh_transcript on
   every page change and page_store notification). Collapsible, hidden
   when text is empty. Text lands here JSON-decoded already and is
   written with textContent (never innerHTML) so a lecture transcript
   can carry no markup of its own. */
window.klausSetTranscript = function (pageIndex, text) {
  const strip = document.getElementById("klausTranscript");
  if (!strip) return;
  strip.querySelector(".ktBody").textContent = text || "";
  strip.classList.toggle("visible", !!text);
};

/* The chevron is static markup (see #klausTranscript above), so it is
   wired ONCE here rather than per-call. */
document.getElementById("ktHead").addEventListener("click", function () {
  const strip = document.getElementById("klausTranscript");
  const head = document.getElementById("ktHead");
  strip.classList.toggle("collapsed");
  head.textContent =
    (strip.classList.contains("collapsed") ? "▸" : "▾") + " Transcript";
});

post("boot");
</script>
