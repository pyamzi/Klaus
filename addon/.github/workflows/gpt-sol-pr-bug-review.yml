name: GPT Sol PR Bug Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review (for manual runs)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  review-pr-diff:
    runs-on: ubuntu-latest
    env:
      # Required setup: add OPENAI_API_KEY as a repository secret.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Optional setup: set OPENAI_MODEL as a repository variable to override default.
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WORKFLOW_PR_NUMBER: ${{ github.event.inputs.pr_number || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review PR diff for likely bugs (advisory)
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from urllib import error, request

          MARKER = "<!-- gpt-sol-pr-bug-review -->"
          MAX_PATCH_CHARS = 120000

          def gh_request(method: str, url: str, token: str, payload=None):
              headers = {
                  "Authorization": "token " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "gpt-sol-pr-bug-review-workflow",
              }
              body = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  body = json.dumps(payload).encode("utf-8")
              req = request.Request(url, data=body, headers=headers, method=method)
              with request.urlopen(req, timeout=60) as resp:
                  raw = resp.read()
              if not raw:
                  return {}
              return json.loads(raw.decode("utf-8"))

          def upsert_pr_comment(token: str, repo: str, pr_number: int, body: str):
              comments_url = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments?per_page=100"
              comments = gh_request("GET", comments_url, token)
              existing = None
              for comment in comments:
                  if MARKER in (comment.get("body") or ""):
                      existing = comment
                      break

              if existing:
                  update_url = f"https://api.github.com/repos/{repo}/issues/comments/{existing['id']}"
                  gh_request("PATCH", update_url, token, {"body": body})
                  print(f"Updated existing marker comment: {existing['id']}")
              else:
                  create_url = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments"
                  gh_request("POST", create_url, token, {"body": body})
                  print("Created new marker comment")

          def load_pr_context():
              event_name = os.environ.get("GITHUB_EVENT_NAME", "")
              event_path = os.environ.get("GITHUB_EVENT_PATH", "")
              repo = os.environ.get("GITHUB_REPOSITORY", "")
              token = os.environ.get("GITHUB_TOKEN", "")

              with open(event_path, "r", encoding="utf-8") as f:
                  payload = json.load(f)

              if event_name == "pull_request":
                  pr = payload["pull_request"]
                  return {
                      "repo": repo,
                      "number": int(pr["number"]),
                      "title": pr.get("title", ""),
                      "body": pr.get("body") or "",
                      "base_sha": pr["base"]["sha"],
                      "head_sha": pr["head"]["sha"],
                      "head_ref": pr["head"].get("ref", ""),
                      "head_repo_full_name": (pr["head"].get("repo") or {}).get("full_name", ""),
                      "is_fork": bool((pr["head"].get("repo") or {}).get("fork", False)),
                  }

              if event_name == "workflow_dispatch":
                  pr_number_raw = os.environ.get("WORKFLOW_PR_NUMBER", "").strip()
                  if not pr_number_raw:
                      raise RuntimeError("workflow_dispatch requires pr_number input")
                  pr_number = int(pr_number_raw)
                  pr_url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}"
                  pr = gh_request("GET", pr_url, token)
                  return {
                      "repo": repo,
                      "number": int(pr["number"]),
                      "title": pr.get("title", ""),
                      "body": pr.get("body") or "",
                      "base_sha": pr["base"]["sha"],
                      "head_sha": pr["head"]["sha"],
                      "head_ref": pr["head"].get("ref", ""),
                      "head_repo_full_name": (pr["head"].get("repo") or {}).get("full_name", ""),
                      "is_fork": bool((pr["head"].get("repo") or {}).get("fork", False)),
                  }

              raise RuntimeError(f"Unsupported event: {event_name}")

          def get_patch(base_sha: str, head_sha: str) -> str:
              # Use only the PR delta, never full repository context.
              result = subprocess.run(
                  ["git", "diff", "--no-color", "--unified=3", f"{base_sha}...{head_sha}"],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              if result.returncode != 0:
                  raise RuntimeError(f"git diff failed: {result.stderr.strip()}")
              return result.stdout

          def extract_output_text(response_obj: dict) -> str:
              if isinstance(response_obj.get("output_text"), str) and response_obj["output_text"].strip():
                  return response_obj["output_text"].strip()

              chunks = []
              for item in response_obj.get("output", []):
                  for part in item.get("content", []):
                      txt = part.get("text")
                      if isinstance(txt, str):
                          chunks.append(txt)
              return "\n".join(chunks).strip()

          def call_openai(model: str, api_key: str, prompt: str) -> str:
              url = "https://api.openai.com/v1/responses"
              payload = {
                  "model": model,
                  "input": [
                      {
                          "role": "system",
                          "content": [
                              {
                                  "type": "input_text",
                                  "text": (
                                      "You are a senior code reviewer focused strictly on likely bugs and regressions. "
                                      "Review only the provided PR metadata and unified diff. "
                                      "Ignore style/nit concerns unless they hide a correctness issue. "
                                      "Look for runtime errors, edge cases, data loss, security-sensitive mistakes, "
                                      "broken API contracts, async/race issues, and test gaps that indicate real bugs. "
                                      "Return concise markdown."
                                  ),
                              }
                          ],
                      },
                      {
                          "role": "user",
                          "content": [{"type": "input_text", "text": prompt}],
                      },
                  ],
              }
              req = request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  method="POST",
                  headers={
                      "Authorization": "Bearer" + " " + api_key,
                      "Content-Type": "application/json",
                  },
              )
              with request.urlopen(req, timeout=120) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
              text = extract_output_text(data)
              return text or "No substantive bugs found."

          def main():
              github_token = os.environ.get("GITHUB_TOKEN", "").strip()
              openai_key = os.environ.get("OPENAI_API_KEY", "").strip()
              model = os.environ.get("OPENAI_MODEL", "gpt-5.6-sol").strip() or "gpt-5.6-sol"

              ctx = load_pr_context()
              repo = ctx["repo"]
              pr_number = ctx["number"]

              if not openai_key:
                  note = (
                      f"{MARKER}\n"
                      "## GPT Sol PR Bug Review (advisory)\n\n"
                      "Skipped: `OPENAI_API_KEY` is not available in this workflow run. "
                      "This is expected for forked pull requests or when the repository secret is not configured."
                  )
                  upsert_pr_comment(github_token, repo, pr_number, note)
                  return

              patch = get_patch(ctx["base_sha"], ctx["head_sha"])
              truncated = False
              if len(patch) > MAX_PATCH_CHARS:
                  patch = patch[:MAX_PATCH_CHARS]
                  truncated = True

              if not patch.strip():
                  message = (
                      f"{MARKER}\n"
                      "## GPT Sol PR Bug Review (advisory)\n\n"
                      "No substantive bugs found. Diff between base/head was empty."
                  )
                  upsert_pr_comment(github_token, repo, pr_number, message)
                  return

              truncation_note = ""
              if truncated:
                  truncation_note = (
                      f"\n\n> Note: Diff exceeded {MAX_PATCH_CHARS} characters and was truncated "
                      "for safe processing."
                  )

              prompt = (
                  "Review this pull request diff and report only likely bugs/regressions with actionable fixes.\n\n"
                  "Output format:\n"
                  "- If bugs found: bullet list where each item includes **Severity**, **File/Area**, **Problem**, **Suggested fix**.\n"
                  "- If none found: exactly `No substantive bugs found.`\n"
                  "- Keep the response concise and in markdown.\n\n"
                  f"PR Title: {ctx['title']}\n"
                  f"PR Body:\n{ctx['body'] or '(empty)'}\n\n"
                  f"Base SHA: {ctx['base_sha']}\n"
                  f"Head SHA: {ctx['head_sha']}\n\n"
                  "Unified diff:\n"
                  "```diff\n"
                  f"{patch}\n"
                  "```"
                  f"{truncation_note}"
              )

              try:
                  review = call_openai(model, openai_key, prompt)
              except error.HTTPError as e:
                  details = e.read().decode("utf-8", errors="replace")
                  review = (
                      "Unable to complete GPT review in this run. "
                      "OpenAI API returned an error; please rerun the workflow.\n\n"
                      f"`HTTP {e.code}`"
                  )
                  print(f"OpenAI HTTP error: {details}", file=sys.stderr)
              except Exception as e:
                  review = (
                      "Unable to complete GPT review in this run due to an unexpected error; "
                      "please rerun the workflow."
                  )
                  print(f"OpenAI call failed: {e}", file=sys.stderr)

              body = (
                  f"{MARKER}\n"
                  "## GPT Sol PR Bug Review (advisory)\n\n"
                  f"Model: `{model}`\n\n"
                  f"{review}"
              )
              upsert_pr_comment(github_token, repo, pr_number, body)

          if __name__ == "__main__":
              try:
                  main()
              except Exception as exc:
                  # Advisory workflow: never block a PR solely due to review tooling failures.
                  print(f"Fatal error in bug review workflow: {exc}", file=sys.stderr)
                  sys.exit(0)
          PY
