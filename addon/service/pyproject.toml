[project]
name = "klausplus"
version = "0.1.0"
description = "Klaus Plus: the metered service behind the KlausMate Anki add-on"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "stripe>=10", "python-multipart>=0.0.9", "bcrypt>=4.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["klausplus*"]
