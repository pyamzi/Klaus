<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>klausmate board</title>
<style>
/* Dispatch console for unattended agent work.
   Organising principle: lit vs unlit. Idle columns are near-greyscale; the
   colour budget goes almost entirely to work that is in flight, because
   that is the only thing the supervisor needs to react to. */
:root {
  --ground:  #e9ebef;
  --panel:   #ffffff;
  --raised:  #dfe2e8;
  --line:    #b7bcc7;
  --ink:     #0b0d13;
  --dim:     #3c4454;
  --faint:   #6b7385;
  --live:    #8a4d00;  /* in flight — the one loud colour */
  --contest: #96271e;  /* collision / blocked */
  --review:  #155950;  /* awaiting sign-off */
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --prose: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--ground);
  color: var(--ink);
  /* Mono is the default here: most of this board's content really is
     identifiers, paths and owners. Prose is the exception, not the rule. */
  font: 13px/1.5 var(--mono);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; font-weight: 600; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }

/* ── status rail ─────────────────────────────────────────────────────── */
.rail {
  display: flex; align-items: baseline; gap: 10px 16px; flex-wrap: wrap;
  padding: 10px 18px; border-bottom: 1px solid var(--line);
  background: var(--panel);
  position: sticky; top: 0; z-index: 20;
}
.rail h1 {
  font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
}
.rail h1 span { color: var(--live); }
.rail .spacer { flex: 1; }
/* nowrap keeps a stat from breaking mid-phrase ("in / flight") when the
   rail runs out of room; the rail wraps whole stats to a second line. */
.stat {
  color: var(--dim); font-size: 11px; letter-spacing: .06em;
  white-space: nowrap;
}
.stat b { color: var(--ink); font-weight: 600; }
.stat.live b { color: var(--live); }
.pulse {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--faint); margin-right: 5px; vertical-align: middle;
}
.pulse.on { background: var(--live); }
.rail button {
  background: transparent; border: 1px solid var(--line);
  border-radius: 5px; padding: 3px 10px; font-size: 11px; color: var(--dim);
}
.rail button:hover { border-color: var(--live); color: var(--ink); }
/* Identity, set once. Claiming needs a name, and asking for it on every
   claim would be a dialog in the way of a drag. */
.me input {
  background: var(--ground); border: 1px solid var(--line); border-radius: 4px;
  color: var(--live); font: inherit; font-size: 11px; padding: 2px 6px;
  margin-left: 4px; width: 88px;
}
.me input:hover { border-color: var(--faint); }

/* Comment composer — inline, because a modal prompt cannot be trusted to
   exist (embedded browser views block window.prompt outright). */
.composer { display: flex; flex-direction: column; gap: 6px; margin-top: 9px; }
.composer textarea {
  width: 100%; min-height: 62px; resize: vertical;
  background: var(--ground); color: var(--ink);
  border: 1px solid var(--line); border-radius: 5px; padding: 7px 8px;
  font-family: var(--prose); font-size: 12.5px; line-height: 1.5;
}
.composer textarea:focus { border-color: var(--live); outline: none; }
.composer .send { display: flex; align-items: center; gap: 8px; }
.composer .send button {
  background: var(--raised); border: 1px solid var(--line);
  border-radius: 5px; padding: 5px 12px; font-size: 11px;
}
.composer .send button:hover:not(:disabled) { border-color: var(--live); }
.composer .send button:disabled { opacity: .4; cursor: default; }
.composer .send span { font-size: 10.5px; color: var(--faint); }

/* ── claim map: the signature ────────────────────────────────────────── */
/* Which regions of the codebase are locked right now, and by whom. This is
   the constraint that lets a swarm run unattended, so it gets top billing
   rather than being buried in a card field. */
.map { padding: 12px 18px; border-bottom: 1px solid var(--line); }
.map-head {
  display: flex; align-items: baseline; gap: 10px; margin-bottom: 9px;
}
.map-head h2 {
  font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--dim);
}
.map-head .hint { font-size: 11px; color: var(--faint); }
.regions { display: flex; gap: 10px; flex-wrap: wrap; }
.region {
  flex: 1 1 150px; min-width: 130px;
  border: 1px solid var(--line); border-radius: 6px;
  padding: 7px 9px; background: var(--panel);
}
.region.claimed { border-color: color-mix(in srgb, var(--live) 45%, var(--line)); }
.region.contested { border-color: var(--contest); }
.region-name { font-size: 11px; color: var(--dim); }
.region.claimed .region-name { color: var(--ink); }
.bar {
  height: 3px; border-radius: 2px; background: var(--line);
  margin: 6px 0 5px; overflow: hidden;
}
.bar i { display: block; height: 100%; background: var(--live); width: 0; }
.region.contested .bar i { background: var(--contest); }
.holds { display: flex; flex-direction: column; gap: 2px; }
.hold { font-size: 10.5px; color: var(--dim); }
.hold b { color: var(--live); font-weight: 500; }
.hold.clash b { color: var(--contest); }
.region-idle { font-size: 10.5px; color: var(--faint); }

/* ── columns ─────────────────────────────────────────────────────────── */
.cols {
  display: grid; grid-template-columns: repeat(5, minmax(190px, 1fr));
  gap: 12px; padding: 14px 18px 28px; align-items: start;
}
.col-head {
  display: flex; align-items: center; gap: 7px;
  padding-bottom: 7px; margin-bottom: 9px;
  border-bottom: 1px solid var(--line);
}
.col-head h2 {
  font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--dim);
}
.col-head .n { font-size: 10px; color: var(--faint); }
.col[data-col="Doing"] .col-head { border-bottom-color: var(--live); }
.col[data-col="Doing"] .col-head h2 { color: var(--live); }
.col[data-col="Review"] .col-head { border-bottom-color: var(--review); }
.col[data-col="Review"] .col-head h2 { color: var(--review); }
.col-head .add-card {
  margin-left: auto; background: transparent; border: 1px solid var(--line);
  border-radius: 4px; width: 18px; height: 18px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; line-height: 1; color: var(--dim);
}
.col-head .add-card:hover { border-color: var(--live); color: var(--live); }
.col-head .archive-all {
  margin-left: auto; background: transparent; border: 1px solid var(--line);
  border-radius: 4px; padding: 2px 8px; font-size: 9.5px; letter-spacing: .04em;
  color: var(--dim);
}
.col-head .archive-all:hover { border-color: var(--contest); color: var(--contest); }
.col-head .archive-all.armed { background: var(--contest); color: #fff; border-color: var(--contest); }
.drop { min-height: 60px; display: flex; flex-direction: column; gap: 8px; }
.drop.over { outline: 1px dashed var(--live); outline-offset: 4px; border-radius: 6px; }

/* Quick add: a single input, nothing else. A prompt-style flow beats a form
   for a card that's just a title — extra fields can be filled in later from
   the drawer once the work is actually understood. */
.quick-add input {
  width: 100%; background: var(--panel); color: var(--ink);
  border: 1px solid var(--live); border-radius: 6px;
  padding: 7px 9px; font: inherit; font-size: 13px;
}
.quick-add input:focus {
  outline: none;
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--live) 30%, transparent);
}
.quick-add input::placeholder { color: var(--faint); }

/* ── cards ───────────────────────────────────────────────────────────── */
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-left: 2px solid var(--faint);
  border-radius: 6px; padding: 9px 10px; cursor: grab;
  transition: border-color .12s ease, background .12s ease;
}
.card:hover { background: var(--raised); }
.card.dragging { opacity: .4; }
.card .id { font-size: 10px; color: var(--faint); letter-spacing: .06em; }
.card .title {
  font-family: var(--prose); font-size: 13px; line-height: 1.35;
  margin: 3px 0 6px; color: var(--dim);
}
.card .meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.tag {
  font-size: 9.5px; letter-spacing: .05em; padding: 1px 5px;
  border: 1px solid var(--line); border-radius: 3px; color: var(--dim);
}
.tag.design   { border-color: #6a5aab; color: #4c3d8c; }
.tag.human    { border-color: var(--contest); color: var(--contest); }
.owner { font-size: 10px; color: var(--live); }
.nofiles { font-size: 9.5px; color: var(--contest); }

/* Lit state: only Doing cards get full ink. */
.col[data-col="Doing"] .card {
  border-left-color: var(--live);
  border-color: color-mix(in srgb, var(--live) 25%, var(--line));
}
.col[data-col="Doing"] .card .title { color: var(--ink); }
.col[data-col="Review"] .card { border-left-color: var(--review); }
.col[data-col="Review"] .card .title { color: var(--ink); }
.col[data-col="Done"] .card { opacity: .5; }

/* One motion cue, and it earns its place: it answers "did something change
   while I was not looking?" for work that runs unattended. */
@keyframes flash {
  from { border-left-color: var(--live); background: color-mix(in srgb, var(--live) 14%, var(--panel)); }
  to   { }
}
.card.changed { animation: flash 1.4s ease-out; }
@media (prefers-reduced-motion: reduce) {
  .card.changed { animation: none; box-shadow: inset 2px 0 0 var(--live); }
}

/* ── detail drawer ───────────────────────────────────────────────────── */
.scrim {
  position: fixed; inset: 0; background: rgba(6,8,12,.6);
  display: none; z-index: 40;
}
.scrim.open { display: block; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%);
  background: var(--panel); border-left: 1px solid var(--line);
  padding: 18px; overflow-y: auto; z-index: 50;
  transform: translateX(100%); transition: transform .16s ease;
}
.drawer.open { transform: none; }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
.drawer h3 { font-family: var(--prose); font-size: 16px; margin: 4px 0 10px; }
.drawer .close {
  float: right; background: transparent; border: none; color: var(--dim);
  font-size: 20px; line-height: 1; padding: 0 4px;
}
.kv { display: grid; grid-template-columns: 70px 1fr; gap: 6px 10px; margin: 10px 0; align-items: center; }
.kv dt { color: var(--faint); font-size: 11px; }
.kv dd { margin: 0; font-size: 11.5px; word-break: break-all; }
/* Fields were read-only text; now they're inputs, styled to match the
   quick-add / composer inputs elsewhere rather than inventing a new look. */
.kv dd input, .kv dd textarea {
  width: 100%; background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 4px;
  padding: 4px 7px; font: inherit; font-size: 11.5px;
  font-family: var(--mono);
}
.kv dd input:focus, .kv dd textarea:focus { border-color: var(--live); outline: none; }
.kv dd textarea { resize: vertical; min-height: 36px; line-height: 1.4; }
.kv-actions { display: flex; align-items: center; gap: 8px; margin: -2px 0 12px; }
.kv-actions button {
  background: var(--raised); border: 1px solid var(--line);
  border-radius: 5px; padding: 5px 12px; font-size: 11px;
}
.kv-actions button:hover:not(:disabled) { border-color: var(--live); }
.kv-actions button:disabled { opacity: .4; cursor: default; }
.kv-actions button.ghost { background: transparent; }
.kv-actions span { font-size: 10.5px; color: var(--faint); }
.body {
  font-family: var(--prose); font-size: 13px; line-height: 1.55;
  white-space: pre-wrap; color: var(--dim);
  border-top: 1px solid var(--line); padding-top: 11px; margin-top: 11px;
}
.cmts { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
.cmts h4 {
  margin: 0 0 6px; font-size: 10px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--faint); font-weight: 600;
}
.cmt { font-size: 11.5px; color: var(--dim); padding: 3px 0; }
/* Attached screenshots. Capped so a tall Anki grab cannot push the
   comment thread off-screen; click opens the full image in a tab. */
.shot { display: block; margin: 6px 0; }
.shot img {
  max-width: 100%; max-height: 260px; border-radius: 6px;
  border: 1px solid var(--line); display: block;
}
.shot:hover img { border-color: var(--live); }
.composer textarea.dropping,
.newcard input.dropping { border-color: var(--live); background: var(--accent-soft, transparent); }
.row { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.row button {
  background: var(--raised); border: 1px solid var(--line);
  border-radius: 5px; padding: 5px 11px; font-size: 11px;
}
.row button:hover { border-color: var(--live); }
.row button.danger { border-color: var(--contest); color: var(--contest); }
.row button.danger:hover { background: color-mix(in srgb, var(--contest) 12%, var(--panel)); }
.row button.danger.armed { background: var(--contest); color: #fff; }
.row button.danger.armed:hover { background: var(--contest); }

.toast {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  background: var(--contest); color: #fff; padding: 8px 14px;
  border-radius: 6px; font-size: 12px; z-index: 60; max-width: 80vw;
  display: none;
}
.toast.show { display: block; }
.empty { color: var(--faint); font-size: 11px; padding: 6px 2px; }

/* ── tablet ──────────────────────────────────────────────────────────── */
/* Stacking five columns vertically turns a board into a list and wastes
   the whole width. Keep them side by side and swipe instead — the column
   row scrolls horizontally and snaps, which is how a kanban is expected to
   behave on touch. */
@media (min-width: 560px) and (max-width: 1199px) {
  .cols {
    grid-template-columns: none;
    grid-auto-flow: column;
    /* Cap at 300px, but never wider than 82vw — on a narrow tablet the next
       column stays partly visible, which is what tells you it can swipe. */
    grid-auto-columns: min(300px, 82vw);
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scroll-snap-type: x proximity;
    scroll-padding-left: 18px;
    padding-bottom: 18px;
    -webkit-overflow-scrolling: touch;
  }
  .col { scroll-snap-align: start; }
  /* Sticky headers so you always know which column you swiped to. */
  .col-head {
    position: sticky; top: 0; z-index: 5;
    background: var(--ground); padding-top: 4px;
  }
  /* An empty column should mark its place, not reserve a screenful. */
  .drop { min-height: 32px; }
  .regions { gap: 8px; }
  .region { flex: 1 1 190px; }
  .newcard { max-width: none; }
}

/* Phone: below this a swipeable column is narrower than a card wants to be,
   so stacking wins. */
@media (max-width: 559px) {
  .cols { grid-template-columns: 1fr; }
  .drop { min-height: 32px; }
  .col[data-col="Backlog"], .col[data-col="Done"] { opacity: .8; }
  .drawer { width: 100%; }
  .grid2 { grid-template-columns: 1fr; }
}

/* ── touch ───────────────────────────────────────────────────────────── */
/* Keyed to the pointer, not the width: a small target is a small target
   on a 13" tablet too. Hover styling is dropped because it sticks after a
   tap on touch and reads as a stuck selection. */
@media (pointer: coarse) {
  .rail button, .row button, .newcard button, .composer .send button {
    min-height: 40px; padding-left: 14px; padding-right: 14px;
    font-size: 12px;
  }
  .col-head .add-card { width: 32px; height: 32px; font-size: 16px; }
  .drawer .close { font-size: 28px; padding: 4px 10px; min-height: 40px; }
  .me input { min-height: 34px; font-size: 12px; }
  .card { padding: 12px; cursor: default; }
  .card .title { font-size: 14px; }
  .newcard input, .newcard select, .newcard textarea { min-height: 40px; }
  .composer textarea { min-height: 76px; font-size: 14px; }
  .card:hover { background: var(--panel); }
}
</style>
</head>
<body>

<div class="rail">
  <h1>klausmate<span>/</span>board</h1>
  <span class="stat live"><span class="pulse" id="pulse"></span><b id="n-doing">0</b> in flight</span>
  <span class="stat"><b id="n-ready">0</b> ready</span>
  <span class="stat"><b id="n-review">0</b> in review</span>
  <span class="spacer"></span>
  <label class="stat me">as <input id="me" spellcheck="false" size="9"></label>
  <span class="stat" id="synced">connecting…</span>
  <button id="refresh">Refresh</button>
</div>

<section class="map">
  <div class="map-head">
    <h2>Claim map</h2>
    <span class="hint" id="map-hint">no files locked</span>
  </div>
  <div class="regions" id="regions"></div>
</section>

<main class="cols" id="cols"></main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Card detail"></aside>
<div class="toast" id="toast"></div>

<script>
"use strict";
const COLS = ["Backlog", "Ready", "Doing", "Review", "Done"];
let board = null, lastMtime = 0, openId = null, prevSig = {}, draft = "";
let addingCol = null, addDraft = "", addShots = [];
const ADDABLE = ["Backlog", "Ready"];

/* Who is acting. Persisted, because claiming needs a name and a per-claim
   dialog would interrupt a drag — and window.prompt is not even available
   in every browser view this dashboard gets opened in. */
function me() {
  const el = document.getElementById("me");
  const v = (el && el.value.trim()) || localStorage.getItem("klaus.me") || "human";
  return v;
}

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

// ---- images -------------------------------------------------------------
// Text with ![](attachments/x.png) rendered as real images. ORDER MATTERS:
// escape everything first, THEN match. The path charset below is strict
// enough that only paths this dashboard itself generated can match, so no
// pasted text can smuggle markup through an attribute.
const IMG_MD = /!\[([^\]]*)\]\((attachments\/[A-Za-z0-9._-]+)\)/g;
const escImg = s => esc(s).replace(IMG_MD,
  (_m, alt, path) => `<a href="${path}" target="_blank" rel="noopener"` +
                     ` class="shot"><img src="${path}" alt="${alt}"></a>`);

// Upload one File/Blob, return its markdown. Throws with a readable
// message so callers can toast it rather than failing silently.
async function uploadImage(file) {
  if (file.size > 8 * 1024 * 1024)
    throw new Error(`image is ${(file.size / 1048576).toFixed(1)} MB; limit is 8 MB`);
  const b64 = await new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("could not read the image"));
    fr.onload = () => res(String(fr.result).split(",")[1] || "");
    fr.readAsDataURL(file);
  });
  const r = await fetch("/api/upload", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ type: file.type, b64 }),
  });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(out.error || `upload failed (${r.status})`);
  return `![](${out.path})`;
}

// Pull images out of a paste/drop event. Returns [] for ordinary text so
// callers can fall through to the browser's own handling.
function imagesFrom(ev) {
  const dt = ev.clipboardData || ev.dataTransfer;
  if (!dt) return [];
  return Array.from(dt.files || []).filter(f => f.type.startsWith("image/"));
}

// Wire a textarea so pasting or dropping a screenshot inserts its markdown
// at the caret. Text pastes are left entirely alone.
function attachImagePaste(el, after) {
  const insert = async (ev, files) => {
    ev.preventDefault();
    for (const f of files) {
      try {
        const md = await uploadImage(f);
        const a = el.selectionStart ?? el.value.length;
        const b = el.selectionEnd ?? el.value.length;
        const pad = a > 0 && !/\s$/.test(el.value.slice(0, a)) ? "\n" : "";
        el.value = el.value.slice(0, a) + pad + md + "\n" + el.value.slice(b);
        el.selectionStart = el.selectionEnd = a + pad.length + md.length + 1;
        el.dispatchEvent(new Event("input", { bubbles: true }));
        if (after) after();
      } catch (e) { toast(e.message); }
    }
  };
  el.addEventListener("paste", ev => {
    const f = imagesFrom(ev);
    if (f.length) insert(ev, f);
  });
  el.addEventListener("dragover", ev => {
    if (imagesFrom(ev).length || (ev.dataTransfer || {}).types?.includes("Files")) {
      ev.preventDefault();
      el.classList.add("dropping");
    }
  });
  el.addEventListener("dragleave", () => el.classList.remove("dropping"));
  el.addEventListener("drop", ev => {
    el.classList.remove("dropping");
    const f = imagesFrom(ev);
    if (f.length) insert(ev, f);
  });
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove("show"), 4200);
}

async function api(path, payload) {
  const r = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { toast(data.error || ("request failed: " + r.status)); return null; }
  await load(true);
  return data;
}

async function load(force) {
  let data;
  try {
    data = await (await fetch("/api/board")).json();
  } catch (e) {
    $("synced").textContent = "server not responding";
    return;
  }
  if (!force && data.mtime === lastMtime) { markSynced(); return; }
  lastMtime = data.mtime;
  board = data;
  render();
  markSynced();
}

function markSynced() {
  $("synced").textContent = "synced " + new Date().toLocaleTimeString();
}

function cardsIn(name) {
  const c = (board.columns || []).find(x => x.name === name);
  return c ? c.cards : [];
}

/* ── claim map ──────────────────────────────────────────────────────── */
/* Group every declared path by its top-level region so the supervisor can
   see territory at a glance rather than reading each card's file list. */
function renderMap() {
  const regions = {};
  const add = (path, owner, col) => {
    const p = String(path);
    const isDir = p.includes("/");
    const top = isDir ? p.split("/")[0] : p;
    const r = (regions[top] = regions[top] || { holds: [], ready: [], dir: false });
    if (isDir) r.dir = true;
    (col === "Doing" ? r.holds : r.ready).push({ path: p, owner });
  };
  cardsIn("Doing").forEach(c => c.files.forEach(f => add(f, c.owner, "Doing")));
  cardsIn("Ready").forEach(c => c.files.forEach(f => add(f, null, "Ready")));

  const names = Object.keys(regions).sort();
  const el = $("regions");
  if (!names.length) {
    el.innerHTML = '<div class="region"><div class="region-idle">'
      + 'Nothing claimed. Overlapping files can’t be claimed twice.</div></div>';
    $("map-hint").textContent = "no files locked";
    return;
  }

  let locked = 0, clashes = 0;
  el.innerHTML = names.map(name => {
    const r = regions[name];
    const held = r.holds.length;
    locked += held;
    // A Ready path that collides with a held path cannot be claimed yet.
    const clash = r.ready.filter(x => r.holds.some(h =>
      h.path === x.path || x.path.startsWith(h.path + "/") || h.path.startsWith(x.path + "/")));
    clashes += clash.length;
    const total = held + r.ready.length;
    const pct = total ? Math.round(held / total * 100) : 0;
    const cls = clash.length ? "contested" : (held ? "claimed" : "");
    const lines = r.holds.map(h =>
      `<div class="hold">${esc(r.dir ? (h.path.split("/").slice(1).join("/") || h.path) : h.path)} <b>@${esc(h.owner)}</b></div>`);
    clash.forEach(c => lines.push(
      `<div class="hold clash">${esc(r.dir ? (c.path.split("/").slice(1).join("/") || c.path) : c.path)} <b>blocked</b></div>`));
    if (!lines.length) lines.push('<div class="region-idle">free</div>');
    return `<div class="region ${cls}">
      <div class="region-name">${esc(name)}${r.dir ? "/" : ""}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="holds">${lines.join("")}</div>
    </div>`;
  }).join("");

  $("map-hint").textContent = locked
    ? `${locked} path${locked === 1 ? "" : "s"} locked`
      + (clashes ? ` · ${clashes} blocked by work in flight` : "")
    : "no files locked";
}

/* ── columns ────────────────────────────────────────────────────────── */
function cardHTML(c) {
  const tags = (c.tags || []).map(t => {
    const k = t === "design" ? "design" : (t === "needs-human" ? "human" : "");
    return `<span class="tag ${k}">${esc(t)}</span>`;
  }).join("");
  const owner = c.owner && c.owner !== "-" ? `<span class="owner">@${esc(c.owner)}</span>` : "";
  const nofiles = (!c.files || !c.files.length)
    ? '<span class="nofiles">no files declared</span>' : "";
  return `<article class="card" draggable="true" data-id="${c.id}" tabindex="0">
    <div class="id">${c.id}</div>
    <div class="title">${esc(c.title)}</div>
    <div class="meta">${owner}${tags}${nofiles}</div>
  </article>`;
}

function render() {
  const sig = {};
  COLS.forEach(col => cardsIn(col).forEach(c => { sig[c.id] = col + "|" + c.owner; }));

  $("cols").innerHTML = COLS.map(col => {
    const cards = cardsIn(col);
    const canAdd = ADDABLE.includes(col);
    const quick = addingCol === col
      ? `<div class="quick-add"><input class="qa-input" data-col="${col}" type="text"
           placeholder="New card title" value="${esc(addDraft)}"></div>`
      : "";
    const inner = quick + (cards.length
      ? cards.map(cardHTML).join("")
      : (quick ? "" : `<div class="empty">—</div>`));
    const addBtn = canAdd
      ? `<button class="add-card" data-col="${col}" aria-label="Add card" title="Add card">+</button>`
      : "";
    // Archive all: only worth showing once there is something to sweep.
    const archiveAllBtn = (col === "Done" && cards.length)
      ? `<button class="archive-all" data-col="${col}" title="Archive every Done card">Archive all</button>`
      : "";
    return `<section class="col" data-col="${col}">
      <div class="col-head"><h2>${col}</h2><span class="n">${cards.length}</span>${addBtn}${archiveAllBtn}</div>
      <div class="drop" data-col="${col}">${inner}</div>
    </section>`;
  }).join("");

  $("n-doing").textContent = cardsIn("Doing").length;
  $("n-ready").textContent = cardsIn("Ready").length;
  $("n-review").textContent = cardsIn("Review").length;
  $("pulse").classList.toggle("on", cardsIn("Doing").length > 0);

  // Flash only what actually moved or changed hands since the last render.
  Object.keys(sig).forEach(id => {
    if (prevSig[id] && prevSig[id] !== sig[id]) {
      const el = document.querySelector(`.card[data-id="${id}"]`);
      if (el) el.classList.add("changed");
    }
  });
  prevSig = sig;

  renderMap();
  wireCards();
  wireQuickAdd();
  wireArchiveAll();
  if (openId) openDrawer(openId);
}

/* Same arm-then-confirm pattern as the drawer's Delete button (see
   openDrawer): no window.confirm, because embedded browser views block it. */
function wireArchiveAll() {
  const btn = document.querySelector(".archive-all");
  if (!btn) return;
  const disarm = () => {
    clearTimeout(btn._armTimer);
    btn.classList.remove("armed");
    btn.textContent = "Archive all";
  };
  btn.onclick = async () => {
    if (!btn.classList.contains("armed")) {
      btn.classList.add("armed");
      btn.textContent = "Confirm archive all";
      btn._armTimer = setTimeout(disarm, 3000);
      return;
    }
    disarm();
    btn.disabled = true;
    await api("/api/archive_all", {});
    btn.disabled = false;
  };
}

/* ── quick add: title only ─────────────────────────────────────────────
   A "+" at the top of Backlog/Ready opens one input. Enter files it and
   leaves the input open for the next one; Escape or an empty blur closes
   it. Everything else about the card (tags, files, verify, body) is filled
   in later from the drawer, once the work is understood well enough to say. */
function wireQuickAdd() {
  document.querySelectorAll(".add-card").forEach(btn => {
    btn.onclick = () => {
      addingCol = btn.dataset.col;
      addDraft = "";
      render();
    };
  });

  const input = document.querySelector(".qa-input");
  if (!input) return;
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
  input.addEventListener("input", () => { addDraft = input.value; });
  // A card title is one line, so an image cannot live in it. Pasted or
  // dropped shots are held here and land in the new card's BODY when it
  // is created — the title stays a title.
  const shotsFor = ev => {
    const files = imagesFrom(ev);
    if (!files.length) return;
    ev.preventDefault();
    files.forEach(async f => {
      try {
        addShots.push(await uploadImage(f));
        const n = addShots.length;
        toast(`${n} image${n > 1 ? "s" : ""} attached — press Enter to create the card`);
      } catch (e) { toast(e.message); }
    });
  };
  input.addEventListener("paste", shotsFor);
  input.addEventListener("dragover", ev => {
    if ((ev.dataTransfer || {}).types?.includes("Files")) ev.preventDefault();
  });
  input.addEventListener("drop", shotsFor);
  input.addEventListener("keydown", async e => {
    if (e.key === "Enter") {
      e.preventDefault();
      const title = input.value.trim();
      if (!title) return;
      const col = input.dataset.col;
      addDraft = "";
      input.disabled = true;
      const body = addShots.join("\n");
      addShots = [];
      await api("/api/add", { col, title, fields: {}, body });
    } else if (e.key === "Escape") {
      e.preventDefault();
      addingCol = null;
      addDraft = "";
      addShots = [];
      render();
    }
  });
  input.addEventListener("blur", () => {
    if (!input.value.trim()) { addingCol = null; addDraft = ""; render(); }
  });
}

/* ── interaction ────────────────────────────────────────────────────── */
function wireCards() {
  document.querySelectorAll(".card").forEach(el => {
    el.addEventListener("dragstart", e => {
      e.dataTransfer.setData("text/plain", el.dataset.id);
      el.classList.add("dragging");
    });
    el.addEventListener("dragend", () => el.classList.remove("dragging"));
    el.addEventListener("click", () => openDrawer(el.dataset.id));
    el.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDrawer(el.dataset.id); }
    });
  });
  document.querySelectorAll(".drop").forEach(zone => {
    zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("over"); });
    zone.addEventListener("dragleave", () => zone.classList.remove("over"));
    zone.addEventListener("drop", async e => {
      e.preventDefault();
      zone.classList.remove("over");
      const id = e.dataTransfer.getData("text/plain");
      const to = zone.dataset.col;
      const from = findCol(id);
      if (!id || from === to) return;
      // Ready→Doing is a claim, not a plain move: it also enforces that no
      // in-flight card already holds these files.
      if (from === "Ready" && to === "Doing") {
        await api("/api/claim", { id, owner: me() });
      } else if (from === "Doing" && to === "Ready") {
        await api("/api/release", { id });
      } else {
        await api("/api/move", { id, to });
      }
    });
  });
}

function findCol(id) {
  for (const col of COLS) if (cardsIn(col).some(c => c.id === id)) return col;
  return null;
}
function findCard(id) {
  for (const col of COLS) {
    const c = cardsIn(col).find(x => x.id === id);
    if (c) return [col, c];
  }
  return [null, null];
}

function openDrawer(id) {
  const [col, c] = findCard(id);
  if (!c) { closeDrawer(); return; }
  openId = id;
  const nexts = { Backlog: ["Ready"], Ready: ["Backlog"], Doing: ["Review", "Ready"],
                  Review: ["Done", "Doing"], Done: ["Backlog"] };
  // Claiming used to be drag-only, which meant it was impossible on a
  // touch device: HTML5 drag events never fire there. It is a button now.
  const claimBtn = col === "Ready"
    ? `<button data-claim="1" class="primary">Claim as ${esc(me())}</button>` : "";
  const archiveBtn = col === "Done"
    ? `<button data-archive="1" class="danger">Archive</button>` : "";
  const btns = claimBtn + (nexts[col] || []).map(t =>
    `<button data-move="${t}">${t === "Ready" && col === "Doing" ? "Release to Ready" : "Move to " + t}</button>`).join("")
    + archiveBtn
    + `<button data-delete="1" class="danger">Delete</button>`;
  $("drawer").innerHTML = `
    <button class="close" aria-label="Close">×</button>
    <div class="id">${c.id} · ${col}</div>
    <h3>${esc(c.title)}</h3>
    <dl class="kv">
      <dt>owner</dt><dd><input id="kv-owner" value="${esc(c.owner === '-' ? '' : (c.owner || ''))}" placeholder="-"></dd>
      <dt>priority</dt><dd><input id="kv-priority" value="${esc(c.priority || '')}" placeholder="P2"></dd>
      <dt>tags</dt><dd><input id="kv-tags" value="${esc((c.tags || []).join(', '))}" placeholder="sonnet-safe, design, needs-human"></dd>
      <dt>files</dt><dd><textarea id="kv-files" rows="2" placeholder="comma-separated paths">${esc((c.files || []).join(', '))}</textarea></dd>
      <dt>verify</dt><dd><input id="kv-verify" value="${esc(c.verify || '')}" placeholder="command that proves it is done"></dd>
    </dl>
    <div class="kv-actions">
      <button id="kv-save" disabled>Save changes</button>
      <button id="kv-cancel" class="ghost">Cancel</button>
      <span id="kv-status"></span>
    </div>
    ${c.body ? `<div class="body">${escImg(c.body)}</div>` : ""}
    <div class="cmts"><h4>Comments</h4>
      ${(c.comments || []).map(x => `<div class="cmt">${escImg(x)}</div>`).join("")
        || '<div class="cmt" style="color:var(--faint)">None yet.</div>'}
    </div>
    <div class="composer">
      <textarea id="cmt" placeholder="Add a comment"></textarea>
      <div class="send">
        <button id="cmt-post" disabled>Post comment</button>
        <span>as ${esc(me())} · ⌘↵ to post</span>
      </div>
    </div>
    <div class="row">${btns}</div>`;
  $("drawer").classList.add("open");
  $("scrim").classList.add("open");
  $("drawer").querySelector(".close").onclick = closeDrawer;

  // Editable metadata (owner/priority/tags/files/verify). These are plain
  // "key: value" lines in BOARD.md, one per line — a stray newline would
  // corrupt the parser, so every value is collapsed to one line on save.
  // Compare against a snapshot to gate Save on an actual change, same as
  // the comment composer gates Post on non-empty text.
  const kvFields = ["owner", "priority", "tags", "files", "verify"];
  const kvOriginal = {
    owner: c.owner === "-" ? "" : (c.owner || ""),
    priority: c.priority || "",
    tags: (c.tags || []).join(", "),
    files: (c.files || []).join(", "),
    verify: c.verify || "",
  };
  const kvSave = $("kv-save"), kvCancel = $("kv-cancel"), kvStatus = $("kv-status");
  const kvDirty = () => kvFields.some(f => $("kv-" + f).value !== kvOriginal[f]);
  const kvCheck = () => { kvSave.disabled = !kvDirty(); kvStatus.textContent = ""; };
  kvFields.forEach(f => $("kv-" + f).addEventListener("input", kvCheck));
  kvCancel.onclick = () => {
    kvFields.forEach(f => { $("kv-" + f).value = kvOriginal[f]; });
    kvCheck();
  };
  kvSave.onclick = async () => {
    const clean = s => s.replace(/\s*\n\s*/g, ", ").trim();
    const fields = {
      owner: clean($("kv-owner").value) || "-",
      priority: clean($("kv-priority").value),
      tags: clean($("kv-tags").value),
      files: clean($("kv-files").value),
      verify: clean($("kv-verify").value),
    };
    kvSave.disabled = true;
    kvStatus.textContent = "Saving…";
    const ok = await api("/api/edit", { id, fields });
    // On success api()'s load(true) reloads the board and re-runs
    // openDrawer(openId), which repaints these inputs from the saved
    // state — that's what clears the dirty flag, not any code here.
    if (!ok) { kvStatus.textContent = ""; kvSave.disabled = false; }
  };
  $("drawer").querySelectorAll("[data-move]").forEach(b => {
    b.onclick = async () => {
      const to = b.dataset.move;
      if (col === "Doing" && to === "Ready") await api("/api/release", { id });
      else await api("/api/move", { id, to });
    };
  });
  const claimEl = $("drawer").querySelector("[data-claim]");
  if (claimEl) claimEl.onclick = () => api("/api/claim", { id, owner: me() });

  // Delete is destructive and irreversible, and window.confirm is not an
  // option here — embedded browser views block modal dialogs outright
  // (the same reason window.prompt was removed from this file). Arm on the
  // first click, require a second click within a few seconds to actually
  // send it; anything else (blur, timeout, another drawer action) disarms.
  const delEl = $("drawer").querySelector("[data-delete]");
  if (delEl) {
    const disarm = () => {
      clearTimeout(delEl._armTimer);
      delEl.classList.remove("armed");
      delEl.textContent = "Delete";
    };
    delEl.onclick = async () => {
      if (!delEl.classList.contains("armed")) {
        delEl.classList.add("armed");
        delEl.textContent = "Click again to delete";
        delEl._armTimer = setTimeout(disarm, 3000);
        return;
      }
      disarm();
      delEl.disabled = true;
      const ok = await api("/api/delete", { id });
      if (ok) closeDrawer();
      else delEl.disabled = false;
    };
  }

  // Archive: same arm/confirm as Delete above (a modal confirm is not an
  // option here either).
  const archEl = $("drawer").querySelector("[data-archive]");
  if (archEl) {
    const disarmA = () => {
      clearTimeout(archEl._armTimer);
      archEl.classList.remove("armed");
      archEl.textContent = "Archive";
    };
    archEl.onclick = async () => {
      if (!archEl.classList.contains("armed")) {
        archEl.classList.add("armed");
        archEl.textContent = "Click again to archive";
        archEl._armTimer = setTimeout(disarmA, 3000);
        return;
      }
      disarmA();
      archEl.disabled = true;
      const ok = await api("/api/archive", { id });
      if (ok) closeDrawer();
      else archEl.disabled = false;
    };
  }

  const ta = $("cmt"), post = $("cmt-post");
  // The board polls every 2s and rebuilds this drawer when it changes;
  // restore whatever was being typed so a poll never eats a draft.
  ta.value = draft;
  post.disabled = !draft.trim();
  ta.addEventListener("input", () => {
    draft = ta.value;
    post.disabled = !draft.trim();
  });
  ta.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); send(); }
  });
  // Paste or drop a screenshot straight into the comment.
  attachImagePaste(ta, () => { draft = ta.value; post.disabled = !draft.trim(); });
  post.onclick = send;

  async function send() {
    const text = ta.value.trim();
    if (!text) return;
    post.disabled = true;
    const ok = await api("/api/comment", { id, author: me(), text });
    if (ok) { draft = ""; const t = $("cmt"); if (t) t.value = ""; }
    else post.disabled = false;
  }
}

function closeDrawer() {
  openId = null;
  draft = "";
  $("drawer").classList.remove("open");
  $("scrim").classList.remove("open");
}

$("scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
$("refresh").onclick = () => load(true);

const meEl = $("me");
meEl.value = localStorage.getItem("klaus.me") || "human";
meEl.addEventListener("change", () => {
  const v = meEl.value.trim() || "human";
  meEl.value = v;
  localStorage.setItem("klaus.me", v);
  if (openId) openDrawer(openId);   // the composer shows who you post as
});

load(true);
setInterval(load, 2000);
</script>
</body>
</html>
