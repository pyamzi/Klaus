[project]
name = "klaus-core"
version = "0.1.0"
description = "Local service behind the Klaus app: PDF library, annotations, semantic index (Milestone 1: library only)"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["klaus_core"]
