[package]
name = "klaus-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anki = { path = "../../vendor/anki/rslib", features = ["rustls"] }
anki_proto = { path = "../../vendor/anki/rslib/proto" }
axum = "0.8.4"
# Decoders for what browsers put on the clipboard; encoders for png/jpg.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff", "ico"] }
prost = "0.13"
regex = "1.11.1"
rand = "0.9.4"
serde_json = "1.0.143"
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["fs"] }
sha2 = "0.11"
base64 = "0.22"
reqwest = { version = "0.12.20", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
prost-build = "0.13"
anki_proto_gen = { path = "../../vendor/anki/rslib/proto_gen" }
# Build-dependency only to make anki_proto's build script (which writes the descriptors) run first.
anki_proto = { path = "../../vendor/anki/rslib/proto" }
anyhow = "1.0.98"
inflections = "1.1.1"
prost-reflect = "0.14.7"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
reqwest = { version = "0.12.20", default-features = false }
tempfile = "3.20.0"
